<script>
/* ---- js/engine/renderer.js ---- */
/* ============================================================
 * renderer.js - all GPU work: sky, terrain, entities, particles,
 * water, block outline and the first-person hand.
 * ============================================================ */
(function () {
  'use strict';
  const MC = window.MC || (window.MC = {});
  const M = MC.math, mat4 = M.mat4, vec3 = M.vec3;
  const glu = MC.glu;
  const STRIDE = MC.MESH.STRIDE;
  const MAX_QUADS = MC.MESH.MAX_QUADS_PER_SEG;

  const TERRAIN_ATTRS = [
    { name: 'aPos', size: 3, type: 0x1403 /*UNSIGNED_SHORT*/, norm: false, offset: 0 },
    { name: 'aUV', size: 2, type: 0x1403, norm: true, offset: 6 },
    { name: 'aLight', size: 4, type: 0x1401 /*UNSIGNED_BYTE*/, norm: true, offset: 10 },
    { name: 'aTint', size: 4, type: 0x1401, norm: true, offset: 14 }
  ];
  const ENTITY_STRIDE = 24;
  const ENTITY_ATTRS = [
    { name: 'aPos', size: 3, type: 0x1406 /*FLOAT*/, norm: false, offset: 0 },
    { name: 'aUV', size: 2, type: 0x1406, norm: false, offset: 12 },
    { name: 'aColor', size: 4, type: 0x1401, norm: true, offset: 20 }
  ];

  /* ============================================================
   * dynamic geometry batch for entities / particles / hand
   * ============================================================ */
  function Batch(quads) {
    this.cap = quads;
    this.buf = new ArrayBuffer(quads * 4 * ENTITY_STRIDE);
    this.f32 = new Float32Array(this.buf);
    this.u8 = new Uint8Array(this.buf);
    this.quads = 0;
  }
  Batch.prototype.reset = function () { this.quads = 0; };
  Batch.prototype.ensure = function (n) {
    if (this.quads + n <= this.cap) return;
    let cap = this.cap;
    while (cap < this.quads + n) cap *= 2;
    const nb = new ArrayBuffer(cap * 4 * ENTITY_STRIDE);
    new Uint8Array(nb).set(this.u8.subarray(0, this.quads * 4 * ENTITY_STRIDE));
    this.buf = nb; this.f32 = new Float32Array(nb); this.u8 = new Uint8Array(nb);
    this.cap = cap;
  };
  // p: 12 floats (4 corners), uv: [u0,v0,u1,v1], col: [r,g,b,a] 0-255
  Batch.prototype.quad = function (p, uv, col) {
    this.ensure(1);
    const base = this.quads * 4 * ENTITY_STRIDE;
    const f = this.f32, u8 = this.u8;
    const CA = [0, 1, 1, 0], CB = [0, 0, 1, 1];
    for (let k = 0; k < 4; k++) {
      const o = base + k * ENTITY_STRIDE, fo = o >> 2;
      f[fo] = p[k * 3]; f[fo + 1] = p[k * 3 + 1]; f[fo + 2] = p[k * 3 + 2];
      f[fo + 3] = uv[0] + (uv[2] - uv[0]) * CA[k];
      f[fo + 4] = uv[1] + (uv[3] - uv[1]) * (1 - CB[k]);
      u8[o + 20] = col[0]; u8[o + 21] = col[1]; u8[o + 22] = col[2]; u8[o + 23] = col[3];
    }
    this.quads++;
  };
  MC.Batch = Batch;

  /* corner order per face, matching the mesher's basis */
  const BOX_FACES = [
    { key: 'xp', n: [1, 0, 0], t: [0, 0, -1], b: [0, 1, 0], o: [1, 0, 1] },
    { key: 'xn', n: [-1, 0, 0], t: [0, 0, 1], b: [0, 1, 0], o: [0, 0, 0] },
    { key: 'yp', n: [0, 1, 0], t: [1, 0, 0], b: [0, 0, -1], o: [0, 1, 1] },
    { key: 'yn', n: [0, -1, 0], t: [1, 0, 0], b: [0, 0, 1], o: [0, 0, 0] },
    { key: 'zp', n: [0, 0, 1], t: [1, 0, 0], b: [0, 1, 0], o: [0, 0, 1] },
    { key: 'zn', n: [0, 0, -1], t: [-1, 0, 0], b: [0, 1, 0], o: [1, 0, 0] }
  ];
  MC.BOX_FACES = BOX_FACES;

  const _p = new Float32Array(12);
  const _v = new Float32Array(3);
  // Emit a transformed axis-aligned box. `m` maps local box space to world.
  // size is in local units, box is centred on the local origin.
  Batch.prototype.box = function (m, sx, sy, sz, uvSet, col, faceShade) {
    for (let f = 0; f < 6; f++) {
      const F = BOX_FACES[f];
      const uv = uvSet[F.key];
      if (!uv) continue;
      const CA = [0, 1, 1, 0], CB = [0, 0, 1, 1];
      for (let k = 0; k < 4; k++) {
        const lx = (F.o[0] + F.t[0] * CA[k] + F.b[0] * CB[k] - 0.5) * sx;
        const ly = (F.o[1] + F.t[1] * CA[k] + F.b[1] * CB[k] - 0.5) * sy;
        const lz = (F.o[2] + F.t[2] * CA[k] + F.b[2] * CB[k] - 0.5) * sz;
        _p[k * 3] = m[0] * lx + m[4] * ly + m[8] * lz + m[12];
        _p[k * 3 + 1] = m[1] * lx + m[5] * ly + m[9] * lz + m[13];
        _p[k * 3 + 2] = m[2] * lx + m[6] * ly + m[10] * lz + m[14];
      }
      let c = col;
      if (faceShade) {
        const s = [0.86, 0.86, 1.0, 0.62, 0.74, 0.74][f];
        c = [col[0] * s, col[1] * s, col[2] * s, col[3]];
      }
      this.quad(_p, uv, c);
    }
  };

  /* ============================================================
   * Renderer
   * ============================================================ */
  function Renderer(canvas) {
    this.canvas = canvas;
    this.gl = null;
    this.chunkMeshes = new Map();
    this.stats = { chunks: 0, quads: 0, entities: 0, draws: 0 };
  }

  Renderer.prototype.init = function () {
    const gl = this.gl = glu.getContext(this.canvas);
    if (!gl) return false;
    const S = MC.shaders;
    this.pTerrain = glu.program(gl, S.TERRAIN_VS, S.TERRAIN_FS, 'terrain');
    this.pEntity = glu.program(gl, S.ENTITY_VS, S.ENTITY_FS, 'entity');
    this.pSky = glu.program(gl, S.SKY_VS, S.SKY_FS, 'sky');
    this.pLine = glu.program(gl, S.LINE_VS, S.LINE_FS, 'line');

    this.texBlocks = glu.texture(gl, MC.atlas.pixels, MC.atlas.size, { mipmap: true });
    this.texItems = glu.texture(gl, MC.atlas.itemPixels, MC.atlas.itemSize, {});
    this.texMobs = glu.texture(gl, MC.mobArt.pixels, MC.mobArt.size, {});

    // one shared index buffer drives every quad mesh in the game
    const idxCount = MAX_QUADS * 6;
    const idx = new Uint16Array(idxCount);
    for (let q = 0; q < MAX_QUADS; q++) {
      const v = q * 4, i = q * 6;
      idx[i] = v; idx[i + 1] = v + 1; idx[i + 2] = v + 2;
      idx[i + 3] = v; idx[i + 4] = v + 2; idx[i + 5] = v + 3;
    }
    this.ibo = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.ibo);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);

    // fullscreen triangle-pair for the sky
    this.skyVBO = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.skyVBO);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);

    this.dynVBO = gl.createBuffer();
    this.lineVBO = gl.createBuffer();

    this.batch = new Batch(4096);
    this.batchBlocks = new Batch(2048);

    this.proj = mat4.create();
    this.view = mat4.create();
    this.vp = mat4.create();
    this.invVP = mat4.create();
    this.camToWorld = mat4.create();
    this.tmpM = mat4.create();
    this.tmpM2 = mat4.create();
    this.planes = new Float32Array(24);
    this.sunDir = vec3.create(0, 1, 0);
    this.fogColor = new Float32Array([0.7, 0.8, 0.95]);
    this.skyTop = new Float32Array([0.35, 0.55, 0.92]);
    this.skyHorizon = new Float32Array([0.66, 0.79, 0.95]);

    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LEQUAL);
    gl.enable(gl.CULL_FACE);
    gl.cullFace(gl.BACK);
    gl.frontFace(gl.CCW);
    gl.clearColor(0.7, 0.8, 0.95, 1);
    return true;
  };

  Renderer.prototype.resize = function (w, h) {
    this.canvas.width = w;
    this.canvas.height = h;
    this.gl.viewport(0, 0, w, h);
  };

  /* ---------------- chunk mesh upload ---------------- */

  Renderer.prototype.uploadChunk = function (chunk, mesh) {
    const gl = this.gl;
    let entry = this.chunkMeshes.get(chunk.key);
    if (!entry) { entry = { segs: [], water: [] }; this.chunkMeshes.set(chunk.key, entry); }
    this.uploadSegments(entry, 'segs', mesh.solid, mesh.solidQuads);
    this.uploadSegments(entry, 'water', mesh.water, mesh.waterQuads);
    entry.cx = chunk.cx; entry.cz = chunk.cz;
    entry.minY = 0; entry.maxY = chunk.maxY + 1;
    chunk.mesh = entry;
    return entry;
  };

  Renderer.prototype.uploadSegments = function (entry, field, data, quads) {
    const gl = this.gl;
    const segs = entry[field];
    const need = Math.ceil(quads / MAX_QUADS);
    while (segs.length > need) { gl.deleteBuffer(segs.pop().vbo); }
    for (let i = 0; i < need; i++) {
      const first = i * MAX_QUADS;
      const count = Math.min(MAX_QUADS, quads - first);
      const bytes = data.subarray(first * 4 * STRIDE, (first + count) * 4 * STRIDE);
      let seg = segs[i];
      if (!seg) { seg = { vbo: gl.createBuffer(), quads: 0 }; segs.push(seg); }
      gl.bindBuffer(gl.ARRAY_BUFFER, seg.vbo);
      gl.bufferData(gl.ARRAY_BUFFER, bytes, gl.STATIC_DRAW);
      seg.quads = count;
    }
  };

  Renderer.prototype.freeChunk = function (key) {
    const gl = this.gl;
    const entry = this.chunkMeshes.get(key);
    if (!entry) return;
    for (let i = 0; i < entry.segs.length; i++) gl.deleteBuffer(entry.segs[i].vbo);
    for (let i = 0; i < entry.water.length; i++) gl.deleteBuffer(entry.water[i].vbo);
    this.chunkMeshes.delete(key);
  };

  /* ---------------- camera & sky colour ---------------- */

  Renderer.prototype.setupCamera = function (cam, aspect, fov, far) {
    mat4.perspective(this.proj, fov, aspect, 0.05, far);
    mat4.identity(this.view);
    // forward is (-sin yaw, -sin pitch, -cos yaw): see Player.lookVector
    mat4.rotateX(this.view, this.view, cam.pitch);
    mat4.rotateY(this.view, this.view, -cam.yaw);
    mat4.translate(this.view, this.view, -cam.x, -cam.y, -cam.z);
    mat4.multiply(this.vp, this.proj, this.view);
    mat4.invert(this.invVP, this.vp);
    M.extractFrustum(this.planes, this.vp);

    // camera-to-world, used to place the first-person hand
    mat4.identity(this.camToWorld);
    mat4.translate(this.camToWorld, this.camToWorld, cam.x, cam.y, cam.z);
    mat4.rotateY(this.camToWorld, this.camToWorld, cam.yaw);
    mat4.rotateX(this.camToWorld, this.camToWorld, -cam.pitch);
    this.cam = cam;
  };

  const DAY_TOP = [0.32, 0.53, 0.94], NIGHT_TOP = [0.014, 0.02, 0.062];
  const DAY_HOR = [0.68, 0.81, 0.97], NIGHT_HOR = [0.045, 0.055, 0.115];
  const SUNSET = [0.98, 0.52, 0.24];

  Renderer.prototype.updateSky = function (world, weather) {
    const s = world.sunAmount();
    const lin = Math.pow(s, 0.55);
    const glow = M.clamp(1 - Math.abs(s - 0.26) / 0.3, 0, 1);
    const rain = weather ? weather.rain : 0;
    for (let i = 0; i < 3; i++) {
      let top = NIGHT_TOP[i] + (DAY_TOP[i] - NIGHT_TOP[i]) * lin;
      let hor = NIGHT_HOR[i] + (DAY_HOR[i] - NIGHT_HOR[i]) * lin;
      hor = hor + (SUNSET[i] - hor) * glow * 0.75;
      top = top + (SUNSET[i] - top) * glow * 0.22;
      if (rain > 0) {
        const grey = [0.42, 0.45, 0.5][i] * (0.25 + lin * 0.75);
        top += (grey - top) * rain; hor += (grey - hor) * rain;
      }
      this.skyTop[i] = top;
      this.skyHorizon[i] = hor;
      this.fogColor[i] = hor * 0.92 + top * 0.08;
    }
    world.sunDir(this.sunDir);
  };

  /* ---------------- passes ---------------- */

  Renderer.prototype.drawSky = function (world, time) {
    const gl = this.gl, p = this.pSky.use();
    gl.depthMask(false);
    gl.disable(gl.CULL_FACE);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.skyVBO);
    glu.enableOnly(gl, [p.a.aPos]);
    gl.vertexAttribPointer(p.a.aPos, 2, gl.FLOAT, false, 0, 0);
    gl.uniformMatrix4fv(p.u.uInvVP, false, this.invVP);
    gl.uniform3f(p.u.uCam, this.cam.x, this.cam.y, this.cam.z);
    gl.uniform3fv(p.u.uSkyTop, this.skyTop);
    gl.uniform3fv(p.u.uSkyHorizon, this.skyHorizon);
    gl.uniform3fv(p.u.uFogColor, this.fogColor);
    gl.uniform3fv(p.u.uSunDir, this.sunDir);
    gl.uniform1f(p.u.uDayLight, world.dayLight());
    gl.uniform1f(p.u.uTime, time);
    gl.uniform1f(p.u.uCloudCover, this.cloudCover === undefined ? 0.35 : this.cloudCover);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.depthMask(true);
    gl.enable(gl.CULL_FACE);
    this.stats.draws++;
  };

  Renderer.prototype.beginTerrain = function (world, time, fogStart, fogEnd) {
    const gl = this.gl, p = this.pTerrain.use();
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.texBlocks);
    gl.uniform1i(p.u.uAtlas, 0);
    gl.uniformMatrix4fv(p.u.uVP, false, this.vp);
    gl.uniform3f(p.u.uCam, this.cam.x, this.cam.y, this.cam.z);
    gl.uniform3fv(p.u.uFogColor, this.fogColor);
    gl.uniform1f(p.u.uFogStart, fogStart);
    gl.uniform1f(p.u.uFogEnd, fogEnd);
    gl.uniform1f(p.u.uDayLight, world.dayLight());
    gl.uniform1f(p.u.uTime, time);
    gl.uniform3fv(p.u.uSunDir, this.sunDir);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.ibo);
    return p;
  };

  Renderer.prototype.drawChunks = function (world, water, renderDist) {
    const gl = this.gl, p = this.pTerrain;
    const cam = this.cam;
    gl.uniform1f(p.u.uAlphaTest, water ? 0.05 : 0.5);
    gl.uniform1f(p.u.uOpacity, water ? 0.76 : 1.0);
    const CY = MC.CHUNK.Y;
    const list = this._visible || (this._visible = []);
    list.length = 0;
    const self = this;
    this.chunkMeshes.forEach(function (entry) {
      const segs = water ? entry.water : entry.segs;
      if (!segs.length) return;
      const x0 = entry.cx * 16, z0 = entry.cz * 16;
      if (!M.aabbInFrustum(self.planes, x0, 0, z0, x0 + 16, entry.maxY + 2, z0 + 16)) return;
      const dx = x0 + 8 - cam.x, dz = z0 + 8 - cam.z;
      entry._d = dx * dx + dz * dz;
      list.push(entry);
    });
    // near-to-far for solids (early-z), far-to-near for translucent water
    list.sort(water ? function (a, b) { return b._d - a._d; } : function (a, b) { return a._d - b._d; });

    for (let i = 0; i < list.length; i++) {
      const entry = list[i];
      const segs = water ? entry.water : entry.segs;
      gl.uniform3f(p.u.uChunkOrigin, entry.cx * 16, 0, entry.cz * 16);
      for (let s = 0; s < segs.length; s++) {
        const seg = segs[s];
        if (!seg.quads) continue;
        gl.bindBuffer(gl.ARRAY_BUFFER, seg.vbo);
        glu.bindAttribs(gl, p, TERRAIN_ATTRS, STRIDE);
        gl.drawElements(gl.TRIANGLES, seg.quads * 6, gl.UNSIGNED_SHORT, 0);
        this.stats.draws++;
        this.stats.quads += seg.quads;
      }
      if (!water) this.stats.chunks++;
    }
  };

  /* ---------------- dynamic batches ---------------- */

  Renderer.prototype.flushBatch = function (batch, tex, opts) {
    if (!batch.quads) return;
    opts = opts || {};
    const gl = this.gl, p = this.pEntity.use();
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.uniform1i(p.u.uTex, 0);
    gl.uniformMatrix4fv(p.u.uVP, false, opts.vp || this.vp);
    gl.uniform3f(p.u.uCam, this.cam.x, this.cam.y, this.cam.z);
    gl.uniform3fv(p.u.uFogColor, this.fogColor);
    gl.uniform1f(p.u.uFogStart, opts.fogStart === undefined ? this.fogStart : opts.fogStart);
    gl.uniform1f(p.u.uFogEnd, opts.fogEnd === undefined ? this.fogEnd : opts.fogEnd);
    gl.uniform1f(p.u.uAlphaTest, opts.alphaTest === undefined ? 0.5 : opts.alphaTest);
    gl.uniform1f(p.u.uFogAmount, opts.fogAmount === undefined ? 1 : opts.fogAmount);
    const ov = opts.overlay || [0, 0, 0, 0];
    gl.uniform4f(p.u.uOverlay, ov[0], ov[1], ov[2], ov[3]);

    gl.bindBuffer(gl.ARRAY_BUFFER, this.dynVBO);
    gl.bufferData(gl.ARRAY_BUFFER, new Uint8Array(batch.buf, 0, batch.quads * 4 * ENTITY_STRIDE), gl.DYNAMIC_DRAW);
    glu.bindAttribs(gl, p, ENTITY_ATTRS, ENTITY_STRIDE);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.ibo);

    let drawn = 0;
    while (drawn < batch.quads) {
      const n = Math.min(MAX_QUADS, batch.quads - drawn);
      if (drawn > 0) {
        gl.bindBuffer(gl.ARRAY_BUFFER, this.dynVBO);
        glu.bindAttribs(gl, p, ENTITY_ATTRS, ENTITY_STRIDE, drawn * 4 * ENTITY_STRIDE);
      }
      gl.drawElements(gl.TRIANGLES, n * 6, gl.UNSIGNED_SHORT, 0);
      drawn += n;
      this.stats.draws++;
    }
  };

  /* ---------------- block selection outline ---------------- */

  Renderer.prototype.drawOutline = function (bx, by, bz, shape) {
    const gl = this.gl, p = this.pLine.use();
    const e = 0.0025;
    const x0 = bx - e, y0 = by - e, z0 = bz - e;
    const x1 = bx + (shape ? shape[0] : 1) + e;
    const y1 = by + (shape ? shape[1] : 1) + e;
    const z1 = bz + (shape ? shape[2] : 1) + e;
    const v = [
      x0, y0, z0, x1, y0, z0, x1, y0, z0, x1, y0, z1, x1, y0, z1, x0, y0, z1, x0, y0, z1, x0, y0, z0,
      x0, y1, z0, x1, y1, z0, x1, y1, z0, x1, y1, z1, x1, y1, z1, x0, y1, z1, x0, y1, z1, x0, y1, z0,
      x0, y0, z0, x0, y1, z0, x1, y0, z0, x1, y1, z0, x1, y0, z1, x1, y1, z1, x0, y0, z1, x0, y1, z1
    ];
    gl.bindBuffer(gl.ARRAY_BUFFER, this.lineVBO);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(v), gl.DYNAMIC_DRAW);
    glu.enableOnly(gl, [p.a.aPos]);
    gl.vertexAttribPointer(p.a.aPos, 3, gl.FLOAT, false, 0, 0);
    gl.uniformMatrix4fv(p.u.uVP, false, this.vp);
    gl.uniform4f(p.u.uColor, 0, 0, 0, 0.45);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.drawArrays(gl.LINES, 0, v.length / 3);
    this.stats.draws++;
  };

  Renderer.prototype.beginFrame = function () {
    const gl = this.gl;
    this.stats.chunks = 0; this.stats.quads = 0; this.stats.draws = 0; this.stats.entities = 0;
    gl.clearColor(this.fogColor[0], this.fogColor[1], this.fogColor[2], 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);
    gl.depthMask(true);
    gl.disable(gl.BLEND);
  };

  MC.Renderer = Renderer;
})();

/* ---- js/game/physics.js ---- */
/* ============================================================
 * physics.js - AABB collision against the voxel grid, plus the
 * DDA voxel raycast used for block targeting.
 * ============================================================ */
(function () {
  'use strict';
  const MC = window.MC || (window.MC = {});
  const CY = MC.CHUNK.Y;

  const PH = {};
  MC.physics = PH;

  /* Is any solid block overlapping this box? */
  function boxBlocked(world, minX, minY, minZ, maxX, maxY, maxZ) {
    const T = MC.blocks.T;
    const x0 = Math.floor(minX), x1 = Math.floor(maxX - 1e-7);
    const y0 = Math.floor(minY), y1 = Math.floor(maxY - 1e-7);
    const z0 = Math.floor(minZ), z1 = Math.floor(maxZ - 1e-7);
    for (let y = y0; y <= y1; y++) {
      if (y < 0) return true;
      if (y >= CY) continue;
      for (let z = z0; z <= z1; z++) {
        for (let x = x0; x <= x1; x++) {
          if (T.solid[world.getBlock(x, y, z)]) return true;
        }
      }
    }
    return false;
  }
  PH.boxBlocked = boxBlocked;

  /* Move an axis-aligned box through the world, one axis at a time.
   * body: { x, y, z, w (half width), h (height), vx, vy, vz, onGround } */
  PH.move = function (world, body, dx, dy, dz) {
    const w = body.w, h = body.h;
    body.onGround = false;
    body.hitWallX = false; body.hitWallZ = false;

    // Y first so landing resolves before the horizontal slide
    if (dy !== 0) {
      const ny = body.y + dy;
      if (boxBlocked(world, body.x - w, ny, body.z - w, body.x + w, ny + h, body.z + w)) {
        if (dy < 0) {
          // settle on top of the first free row
          let gy = Math.floor(ny);
          while (gy < CY && boxBlocked(world, body.x - w, gy, body.z - w, body.x + w, gy + h, body.z + w)) gy++;
          body.y = gy;
          body.onGround = true;
        } else {
          // stop just below the ceiling the head ran into
          body.y = Math.floor(ny + h) - h - 1e-4;
        }
        body.vy = 0;
      } else {
        body.y = ny;
      }
    }

    if (dx !== 0) {
      const nx = body.x + dx;
      if (boxBlocked(world, nx - w, body.y + 0.02, body.z - w, nx + w, body.y + h, body.z + w)) {
        body.vx = 0; body.hitWallX = true;
      } else body.x = nx;
    }
    if (dz !== 0) {
      const nz = body.z + dz;
      if (boxBlocked(world, body.x - w, body.y + 0.02, nz - w, body.x + w, body.y + h, nz + w)) {
        body.vz = 0; body.hitWallZ = true;
      } else body.z = nz;
    }

    if (!body.onGround && dy <= 0) {
      body.onGround = boxBlocked(world, body.x - w, body.y - 0.02, body.z - w,
                                 body.x + w, body.y, body.z + w);
    }
  };

  PH.isBlockedAt = function (world, x, y, z, w, h) {
    const T = MC.blocks.T;
    const x0 = Math.floor(x - w), x1 = Math.floor(x + w - 1e-7);
    const y0 = Math.floor(y), y1 = Math.floor(y + h - 1e-7);
    const z0 = Math.floor(z - w), z1 = Math.floor(z + w - 1e-7);
    for (let yy = y0; yy <= y1; yy++)
      for (let zz = z0; zz <= z1; zz++)
        for (let xx = x0; xx <= x1; xx++)
          if (T.solid[world.getBlock(xx, yy, zz)]) return true;
    return false;
  };

  /* Which fluid is the box sitting in? */
  PH.fluidAt = function (world, x, y, z, w, h) {
    const water = MC.blocks.idOf('water'), lava = MC.blocks.idOf('lava');
    const x0 = Math.floor(x - w), x1 = Math.floor(x + w - 1e-7);
    const y0 = Math.floor(y), y1 = Math.floor(y + h - 1e-7);
    const z0 = Math.floor(z - w), z1 = Math.floor(z + w - 1e-7);
    let inWater = false, inLava = false;
    for (let yy = y0; yy <= y1; yy++)
      for (let zz = z0; zz <= z1; zz++)
        for (let xx = x0; xx <= x1; xx++) {
          const id = world.getBlock(xx, yy, zz);
          if (id === water) inWater = true;
          else if (id === lava) inLava = true;
        }
    return { water: inWater, lava: inLava };
  };

  /* ---------------- voxel raycast (Amanatides & Woo) ---------------- */
  PH.raycast = function (world, ox, oy, oz, dx, dy, dz, maxDist, opts) {
    opts = opts || {};
    const T = MC.blocks.T;
    let x = Math.floor(ox), y = Math.floor(oy), z = Math.floor(oz);
    const stepX = dx > 0 ? 1 : -1, stepY = dy > 0 ? 1 : -1, stepZ = dz > 0 ? 1 : -1;
    const tDeltaX = dx === 0 ? Infinity : Math.abs(1 / dx);
    const tDeltaY = dy === 0 ? Infinity : Math.abs(1 / dy);
    const tDeltaZ = dz === 0 ? Infinity : Math.abs(1 / dz);
    let tMaxX = dx === 0 ? Infinity : ((dx > 0 ? x + 1 - ox : ox - x) * tDeltaX);
    let tMaxY = dy === 0 ? Infinity : ((dy > 0 ? y + 1 - oy : oy - y) * tDeltaY);
    let tMaxZ = dz === 0 ? Infinity : ((dz > 0 ? z + 1 - oz : oz - z) * tDeltaZ);
    let face = -1;
    let t = 0;

    for (let i = 0; i < 512; i++) {
      const id = world.getBlock(x, y, z);
      if (id !== 0) {
        const hit = opts.fluids ? true : (T.render[id] !== 3);
        const solid = opts.plants ? true : (T.render[id] !== 2);
        if (hit && (solid || opts.plants)) {
          if (!(T.render[id] === 3 && !opts.fluids) && !(T.render[id] === 2 && !opts.plants)) {
            return {
              x: x, y: y, z: z, id: id, face: face, dist: t,
              nx: face === 0 ? -stepX : 0,
              ny: face === 1 ? -stepY : 0,
              nz: face === 2 ? -stepZ : 0
            };
          }
        }
      }
      if (tMaxX < tMaxY) {
        if (tMaxX < tMaxZ) { x += stepX; t = tMaxX; tMaxX += tDeltaX; face = 0; }
        else { z += stepZ; t = tMaxZ; tMaxZ += tDeltaZ; face = 2; }
      } else {
        if (tMaxY < tMaxZ) { y += stepY; t = tMaxY; tMaxY += tDeltaY; face = 1; }
        else { z += stepZ; t = tMaxZ; tMaxZ += tDeltaZ; face = 2; }
      }
      if (t > maxDist) break;
      if (y < 0 || y >= CY) break;
    }
    return null;
  };
})();

</script>
<script>
/* ---- js/game/player.js ---- */
/* ============================================================
 * player.js - movement, camera, survival stats, block reach.
 * ============================================================ */
(function () {
  'use strict';
  const MC = window.MC || (window.MC = {});
  const PH = MC.physics;
  const clamp = MC.math.clamp;

  const WALK = 4.317, SPRINT = 5.612, SNEAK = 1.31;
  const FLY = 10.9, FLY_SPRINT = 21.6;
  const GRAVITY = 32, JUMP_V = 8.95;
  const SWIM_SPEED = 2.4;
  const EYE = 1.62, EYE_SNEAK = 1.42;

  function Player(world, opts) {
    opts = opts || {};
    this.world = world;
    this.x = opts.x || 0; this.y = opts.y || 80; this.z = opts.z || 0;
    this.vx = 0; this.vy = 0; this.vz = 0;
    this.yaw = opts.yaw || 0; this.pitch = opts.pitch || 0;
    this.w = 0.3; this.h = 1.8;
    this.onGround = false;
    this.mode = opts.mode || 'survival';
    this.flying = this.mode === 'creative' && !!opts.flying;
    this.sprinting = false;
    this.sneaking = false;
    this.inWater = false; this.inLava = false; this.headUnderwater = false;
    this.health = opts.health === undefined ? 20 : opts.health;
    this.maxHealth = 20;
    this.hunger = opts.hunger === undefined ? 20 : opts.hunger;
    this.saturation = 5;
    this.exhaustion = 0;
    this.air = 300; this.maxAir = 300;
    this.xp = 0; this.level = 0;
    this.selected = 0;
    this.bob = 0; this.bobAmount = 0;
    this.swingTime = 1; this.swinging = false;
    this.hurtTime = 0;
    this.fallStart = null;
    this.regenTimer = 0; this.starveTimer = 0; this.drownTimer = 0;
    this.lastDamageSource = null;
    this.dead = false;
    this.respawnPoint = { x: this.x, y: this.y, z: this.z };
    this.jumpCooldown = 0;
    this.flyToggleTime = -1;
    this.stepDistance = 0;
    this.breaking = null;
    this.attackCooldown = 0;
    this.eatTime = 0;
  }

  Player.prototype.eyeY = function () {
    return this.y + (this.sneaking ? EYE_SNEAK : EYE);
  };

  Player.prototype.reach = function () { return this.mode === 'creative' ? 5.2 : 4.5; };

  Player.prototype.lookVector = function (out) {
    const cp = Math.cos(this.pitch), sp = Math.sin(this.pitch);
    const cy = Math.cos(this.yaw), sy = Math.sin(this.yaw);
    out[0] = -cp * sy;
    out[1] = -sp;
    out[2] = -cp * cy;
    return out;
  };

  /* ---------------- main update ---------------- */

  Player.prototype.update = function (dt, input, game) {
    const world = this.world;
    if (this.dead) { this.vx = this.vy = this.vz = 0; return; }

    const fluid = PH.fluidAt(world, this.x, this.y, this.z, this.w, this.h);
    this.inWater = fluid.water;
    this.inLava = fluid.lava;
    const headBlock = world.getBlock(Math.floor(this.x), Math.floor(this.eyeY()), Math.floor(this.z));
    this.headUnderwater = headBlock === MC.blocks.idOf('water');
    this.headInLava = headBlock === MC.blocks.idOf('lava');

    this.sneaking = input.down('sneak') && !this.flying;
    const wantSprint = input.down('sprint') && !this.sneaking;

    /* --- desired horizontal direction in world space --- */
    let fwd = 0, str = 0;
    if (input.down('forward')) fwd += 1;
    if (input.down('back')) fwd -= 1;
    if (input.down('left')) str -= 1;
    if (input.down('right')) str += 1;
    const len = Math.hypot(fwd, str);
    if (len > 0) { fwd /= len; str /= len; }
    const sy = Math.sin(this.yaw), cy = Math.cos(this.yaw);
    let wishX = -fwd * sy + str * cy;
    let wishZ = -fwd * cy - str * sy;

    if (len > 0 && wantSprint && fwd > 0 && !this.inWater) this.sprinting = true;
    if (len === 0 || fwd <= 0) this.sprinting = false;
    if (this.mode === 'survival' && this.hunger <= 6) this.sprinting = false;

    /* --- speed for the current medium --- */
    let speed;
    if (this.flying) speed = (wantSprint ? FLY_SPRINT : FLY);
    else if (this.inLava) speed = 1.6;
    else if (this.inWater) speed = SWIM_SPEED;
    else if (this.sneaking) speed = SNEAK;
    else if (this.sprinting) speed = SPRINT;
    else speed = WALK;

    const accel = (this.onGround || this.flying || this.inWater) ? 26 : 7;
    const k = Math.min(1, accel * dt);
    this.vx += (wishX * speed - this.vx) * k;
    this.vz += (wishZ * speed - this.vz) * k;

    /* --- vertical --- */
    if (this.flying) {
      let vy = 0;
      if (input.down('jump')) vy += speed;
      if (input.down('sneak')) vy -= speed;
      this.vy += (vy - this.vy) * Math.min(1, 18 * dt);
    } else if (this.inWater || this.inLava) {
      const g = this.inLava ? 12 : 9;
      this.vy -= g * dt;
      if (input.down('jump')) this.vy = Math.min(this.vy + 22 * dt, this.inLava ? 1.6 : 3.2);
      else if (input.down('sneak')) this.vy = Math.max(this.vy - 14 * dt, -3.2);
      this.vy = clamp(this.vy, -4, 4);
      this.vy *= Math.pow(0.06, dt);
      this.vy += (this.inLava ? -0.9 : -0.55) * dt * 3;
      this.fallStart = null;
    } else {
      this.vy -= GRAVITY * dt;
      if (this.vy < -78) this.vy = -78;
      if (input.down('jump') && this.onGround && this.jumpCooldown <= 0) {
        this.vy = JUMP_V;
        this.jumpCooldown = 0.12;
        this.exhaust(this.sprinting ? 0.2 : 0.05);
        if (game) game.audio.play('jump', 0.25);
      }
    }
    this.jumpCooldown -= dt;

    /* --- integrate --- */
    const wasGround = this.onGround;
    const py = this.y;
    let dx = this.vx * dt, dy = this.vy * dt, dz = this.vz * dt;

    // sneaking on the edge of a block stops you walking off it
    if (this.sneaking && this.onGround) {
      const probe = 0.05;
      if (!PH.boxBlocked(world, this.x + dx - this.w, this.y - probe, this.z - this.w,
                         this.x + dx + this.w, this.y, this.z + this.w)) dx = 0;
      if (!PH.boxBlocked(world, this.x - this.w, this.y - probe, this.z + dz - this.w,
                         this.x + this.w, this.y, this.z + dz + this.w)) dz = 0;
    }

    PH.move(world, this, dx, dy, dz);

    /* --- fall damage --- */
    if (!this.flying && this.mode === 'survival') {
      if (!this.onGround && this.vy < 0 && this.fallStart === null) this.fallStart = this.y;
      if (this.vy > 0) this.fallStart = null;
      if (this.onGround && !wasGround && this.fallStart !== null) {
        const dist = this.fallStart - this.y;
        if (dist > 3.5 && !this.inWater) {
          this.damage(Math.floor(dist - 3), 'fall');
          if (game) game.audio.play('hurt', 0.4);
        }
        this.fallStart = null;
      }
      if (this.onGround) this.fallStart = null;
    }
    if (this.flying && this.onGround && !input.down('jump')) this.flying = false;

    /* --- footsteps & view bob --- */
    const hspeed = Math.hypot(this.vx, this.vz);
    this.bobAmount += ((this.onGround && hspeed > 0.4 ? Math.min(1, hspeed / WALK) : 0) - this.bobAmount) * Math.min(1, 10 * dt);
    this.bob += hspeed * dt * 1.9;
    if (this.onGround && hspeed > 0.5) {
      this.stepDistance += hspeed * dt;
      if (this.stepDistance > 2.1) {
        this.stepDistance = 0;
        if (game) {
          const below = world.getBlock(Math.floor(this.x), Math.floor(this.y - 0.2), Math.floor(this.z));
          game.audio.step(MC.blocks.get(below).sound);
        }
        this.exhaust(this.sprinting ? 0.1 : 0.01);
      }
    }

    /* --- survival upkeep --- */
    if (this.mode === 'survival') this.survivalTick(dt, game);
    else { this.health = this.maxHealth; this.hunger = 20; this.air = this.maxAir; }

    this.hurtTime = Math.max(0, this.hurtTime - dt);
    this.attackCooldown = Math.max(0, this.attackCooldown - dt);
    if (this.swinging) {
      this.swingTime += dt * 3.4;
      if (this.swingTime >= 1) { this.swingTime = 1; this.swinging = false; }
    }
  };

  Player.prototype.survivalTick = function (dt, game) {
    /* breathing */
    if (this.headUnderwater) {
      this.air -= dt * 60;
      if (this.air <= 0) {
        this.air = 0;
        this.drownTimer += dt;
        if (this.drownTimer >= 1) { this.drownTimer = 0; this.damage(2, 'drown'); }
      }
    } else {
      this.air = Math.min(this.maxAir, this.air + dt * 180);
      this.drownTimer = 0;
    }
    if (this.inLava || this.headInLava) {
      this.lavaTimer = (this.lavaTimer || 0) + dt;
      if (this.lavaTimer >= 0.5) { this.lavaTimer = 0; this.damage(2, 'lava'); }
    }

    /* hunger & regeneration */
    if (this.exhaustion >= 4) {
      this.exhaustion -= 4;
      if (this.saturation > 0) this.saturation = Math.max(0, this.saturation - 1);
      else this.hunger = Math.max(0, this.hunger - 1);
    }
    if (this.hunger >= 18 && this.health < this.maxHealth) {
      this.regenTimer += dt;
      if (this.regenTimer >= 3.5) {
        this.regenTimer = 0;
        this.health = Math.min(this.maxHealth, this.health + 1);
        this.exhaust(1.5);
      }
    } else this.regenTimer = 0;
    if (this.hunger === 0) {
      this.starveTimer += dt;
      if (this.starveTimer >= 4) { this.starveTimer = 0; this.damage(1, 'starve'); }
    }
  };

  Player.prototype.exhaust = function (a) {
    if (this.mode !== 'survival') return;
    this.exhaustion += a;
  };

  Player.prototype.damage = function (amount, source) {
    if (this.mode === 'creative' && source !== 'void') return;
    if (this.hurtTime > 0.35 && source !== 'void') return;
    this.health -= amount;
    this.hurtTime = 0.5;
    this.lastDamageSource = source;
    if (this.health <= 0) { this.health = 0; this.dead = true; }
  };

  Player.prototype.heal = function (n) {
    this.health = Math.min(this.maxHealth, this.health + n);
  };

  Player.prototype.eat = function (food) {
    this.hunger = Math.min(20, this.hunger + food.hunger);
    this.saturation = Math.min(this.hunger, this.saturation + food.saturation);
  };

  Player.prototype.addXP = function (n) {
    this.xp += n;
    while (this.xp >= this.xpToNext()) { this.xp -= this.xpToNext(); this.level++; }
  };
  Player.prototype.xpToNext = function () {
    const l = this.level;
    if (l < 16) return 2 * l + 7;
    if (l < 31) return 5 * l - 38;
    return 9 * l - 158;
  };

  Player.prototype.respawn = function (world) {
    this.dead = false;
    this.health = this.maxHealth;
    this.hunger = 20; this.saturation = 5; this.exhaustion = 0;
    this.air = this.maxAir;
    this.vx = this.vy = this.vz = 0;
    const p = this.respawnPoint;
    this.x = p.x + 0.5; this.z = p.z + 0.5;
    const top = world.topSolid(Math.floor(this.x), Math.floor(this.z));
    this.y = top >= 0 ? top + 1 : p.y;
    this.fallStart = null;
    this.hurtTime = 0;
  };

  Player.prototype.setMode = function (m) {
    this.mode = m;
    if (m === 'creative') { this.health = 20; this.hunger = 20; }
    else this.flying = false;
  };

  Player.prototype.toggleFly = function () {
    if (this.mode !== 'creative') return;
    this.flying = !this.flying;
    if (this.flying) this.vy = 0;
  };

  Player.prototype.swing = function () {
    this.swinging = true;
    this.swingTime = 0;
  };

  MC.Player = Player;
})();

</script>
<script>
/* ---- js/game/entities.js ---- */
/* ============================================================
 * entities.js - mobs, dropped items, projectiles and particles.
 * ============================================================ */
(function () {
  'use strict';
  const MC = window.MC || (window.MC = {});
  const PH = MC.physics;
  const M = MC.math, mat4 = M.mat4;
  const clamp = M.clamp;
  const GRAVITY = 32;

  /* ============================================================
   * Mob
   * ============================================================ */
  function Mob(type, x, y, z, opts) {
    opts = opts || {};
    const art = MC.mobArt.MOBS[type];
    this.type = type;
    this.art = art;
    this.x = x; this.y = y; this.z = z;
    this.vx = 0; this.vy = 0; this.vz = 0;
    this.yaw = Math.random() * Math.PI * 2;
    this.bodyYaw = this.yaw;
    this.headYaw = 0; this.headPitch = 0;
    this.baby = !!opts.baby;
    const bs = this.baby ? art.babyScale : 1;
    this.scale = art.scale * bs;
    this.w = art.width * bs / 2;
    this.h = art.height * bs;
    this.health = art.health;
    this.maxHealth = art.health;
    this.onGround = false;
    this.walkTime = Math.random() * 10;
    this.walkAmount = 0;
    this.idle = Math.random() * 100;
    this.hurtTime = 0;
    this.dead = false;
    this.deathTime = 0;
    this.aiTimer = Math.random() * 2;
    this.wishX = 0; this.wishZ = 0;
    this.jumpTimer = 0;
    this.attackTimer = 0;
    this.target = null;
    this.fuse = -1;                       // creepers
    this.age = 0;
    this.panicTimer = 0;
    this.despawnTimer = 0;
    this.inWater = false;
    this.fallStart = null;
  }

  Mob.prototype.eyeY = function () { return this.y + this.h * 0.85; };

  Mob.prototype.update = function (dt, world, game) {
    this.age += dt;
    if (this.dead) { this.deathTime += dt; return; }
    this.hurtTime = Math.max(0, this.hurtTime - dt);
    this.attackTimer = Math.max(0, this.attackTimer - dt);

    const fluid = PH.fluidAt(world, this.x, this.y, this.z, this.w, this.h);
    this.inWater = fluid.water;

    this.think(dt, world, game);

    /* --- movement --- */
    const speed = this.art.speed * (this.panicTimer > 0 ? 1.75 : 1) * (this.baby ? 1.2 : 1);
    const k = Math.min(1, (this.onGround ? 14 : 4) * dt);
    this.vx += (this.wishX * speed - this.vx) * k;
    this.vz += (this.wishZ * speed - this.vz) * k;

    if (this.inWater) {
      this.vy = clamp(this.vy - 8 * dt, -2.4, 2.4);
      this.vy += 14 * dt;                  // float
      this.vy *= Math.pow(0.2, dt);
    } else {
      this.vy -= GRAVITY * dt;
      if (this.vy < -70) this.vy = -70;
    }

    const wasGround = this.onGround;
    PH.move(world, this, this.vx * dt, this.vy * dt, this.vz * dt);

    // hop over one-block obstacles
    if ((this.hitWallX || this.hitWallZ) && this.onGround && this.jumpTimer <= 0) {
      this.vy = 8.2; this.jumpTimer = 0.5;
    }
    this.jumpTimer -= dt;

    if (this.y < -8) { this.health = 0; this.kill(game); }

    /* --- fall damage --- */
    if (!this.onGround && this.vy < 0 && this.fallStart === null) this.fallStart = this.y;
    if (this.vy > 0) this.fallStart = null;
    if (this.onGround && !wasGround && this.fallStart !== null) {
      const d = this.fallStart - this.y;
      if (d > 3.5 && !this.inWater) this.hurt(Math.floor(d - 3), game, null);
      this.fallStart = null;
    }

    /* --- animation --- */
    const hs = Math.hypot(this.vx, this.vz);
    this.walkAmount += (Math.min(1, hs / 2.2) - this.walkAmount) * Math.min(1, 8 * dt);
    this.walkTime += hs * dt * 2.6;
    this.idle += dt;
    if (hs > 0.1) {
      const want = Math.atan2(-this.vx, -this.vz);
      this.bodyYaw += M.angleDiff(this.bodyYaw, want) * Math.min(1, 7 * dt);
    }

    /* --- hostile mobs burn in daylight --- */
    if ((this.type === 'zombie' || this.type === 'skeleton') && !world.isNight()) {
      const sky = world.getSkyLight(Math.floor(this.x), Math.floor(this.y + this.h), Math.floor(this.z));
      if (sky >= 14 && world.dayLight() > 0.6) {
        this.burnTimer = (this.burnTimer || 0) + dt;
        this.burning = true;
        if (this.burnTimer > 1) { this.burnTimer = 0; this.hurt(1, game, null); }
      } else this.burning = false;
    }
  };

  Mob.prototype.think = function (dt, world, game) {
    const art = this.art;
    const player = game ? game.player : null;
    this.aiTimer -= dt;
    this.panicTimer = Math.max(0, this.panicTimer - dt);

    let dist = Infinity;
    if (player && !player.dead) {
      dist = Math.hypot(player.x - this.x, (player.y - this.y) * 0.6, player.z - this.z);
    }

    /* --- hostiles hunt the player --- */
    if (art.hostile && player && !player.dead && player.mode !== 'creative' && dist < 22) {
      this.target = player;
      const dx = player.x - this.x, dz = player.z - this.z;
      const len = Math.hypot(dx, dz) || 1;

      if (this.type === 'creeper') {
        if (dist < 3.2) {
          this.fuse = this.fuse < 0 ? 1.5 : this.fuse - dt;
          this.wishX = 0; this.wishZ = 0;
          if (this.fuse <= 0) { this.explode(world, game); return; }
        } else {
          this.fuse = -1;
          this.wishX = dx / len; this.wishZ = dz / len;
        }
      } else if (this.type === 'skeleton' && dist < 12 && dist > 4) {
        this.wishX = 0; this.wishZ = 0;
        if (this.attackTimer <= 0) {
          this.attackTimer = 2.0;
          if (game) game.spawnArrow(this, player);
        }
      } else {
        this.wishX = dx / len; this.wishZ = dz / len;
        if (dist < 1.9 && this.attackTimer <= 0 && art.damage > 0) {
          this.attackTimer = 1.0;
          player.damage(art.damage, 'mob');
          const kb = 4.5;
          player.vx += dx / len * kb; player.vz += dz / len * kb; player.vy = 4;
          if (game) game.audio.play('hurt', 0.5);
        }
      }
      this.headYaw = M.angleDiff(this.bodyYaw, Math.atan2(-dx, -dz));
      this.headPitch = clamp(Math.atan2(this.y + this.h - player.eyeY(), len), -0.8, 0.8);
      return;
    }

    /* --- passive wandering --- */
    if (this.panicTimer > 0) {
      // keep running from whatever hit us
      if (this.aiTimer <= 0) { this.aiTimer = 0.6; }
    } else if (this.aiTimer <= 0) {
      this.aiTimer = 1.5 + Math.random() * 4;
      if (Math.random() < 0.42) { this.wishX = 0; this.wishZ = 0; }
      else {
        const a = Math.random() * Math.PI * 2;
        this.wishX = Math.cos(a); this.wishZ = Math.sin(a);
      }
    }

    // look at a nearby player when idle
    if (player && dist < 8) {
      const dx = player.x - this.x, dz = player.z - this.z;
      const len = Math.hypot(dx, dz) || 1;
      const want = M.angleDiff(this.bodyYaw, Math.atan2(-dx, -dz));
      this.headYaw += (clamp(want, -1.2, 1.2) - this.headYaw) * Math.min(1, 4 * dt);
      this.headPitch += (clamp(Math.atan2(this.y + this.h - player.eyeY(), len), -0.7, 0.7) - this.headPitch) * Math.min(1, 4 * dt);
    } else {
      this.headYaw *= Math.pow(0.2, dt);
      this.headPitch *= Math.pow(0.2, dt);
    }
  };

  Mob.prototype.explode = function (world, game) {
    if (game) game.explode(this.x, this.y + 0.6, this.z, 3.1);
    this.health = 0;
    this.dead = true;
    this.deathTime = 0.45;
  };

  Mob.prototype.hurt = function (amount, game, fromEntity) {
    if (this.dead) return;
    if (this.hurtTime > 0.25) return;
    this.health -= amount;
    this.hurtTime = 0.5;
    this.panicTimer = 6;
    if (fromEntity) {
      const dx = this.x - fromEntity.x, dz = this.z - fromEntity.z;
      const l = Math.hypot(dx, dz) || 1;
      this.vx += dx / l * 6; this.vz += dz / l * 6; this.vy = 5.2;
      if (!this.art.hostile) { this.wishX = dx / l; this.wishZ = dz / l; }
    }
    if (game) game.audio.play('hit', 0.3);
    if (this.health <= 0) this.kill(game);
  };

  Mob.prototype.kill = function (game) {
    if (this.dead) return;
    this.dead = true;
    this.deathTime = 0;
    if (!game) return;
    const drops = this.art.drops;
    for (let i = 0; i < drops.length; i++) {
      const d = drops[i];
      const n = d[1] + Math.floor(Math.random() * (d[2] - d[1] + 1));
      if (n > 0) game.dropItem(this.x, this.y + 0.4, this.z, d[0], n);
    }
    if (this.art.xp) game.spawnXP(this.x, this.y + 0.4, this.z, this.art.xp);
  };

  /* ---------------- rendering ---------------- */
  const _m = mat4.create(), _t = mat4.create(), _r = mat4.create();
  const WHITE = [255, 255, 255, 255];

  Mob.prototype.render = function (batch, dt, camY) {
    const art = this.art;
    const parts = art.parts;
    const swing = Math.sin(this.walkTime) * this.walkAmount;
    const swing2 = Math.sin(this.walkTime + Math.PI) * this.walkAmount;
    const breathe = Math.sin(this.idle * 1.4) * 0.03;

    let deathTilt = 0;
    if (this.dead) deathTilt = Math.min(1, this.deathTime / 0.5) * Math.PI * 0.5;
    const alpha = this.dead ? Math.max(0, 1 - this.deathTime / 0.9) : 1;
    if (alpha <= 0) return;

    let col = WHITE;
    if (this.hurtTime > 0.25) col = [255, 120, 120, 255 * alpha];
    else if (alpha < 1) col = [255, 255, 255, 255 * alpha];
    if (this.fuse >= 0) {
      const f = 1 - this.fuse / 1.5;
      const flash = (Math.sin(f * 40) * 0.5 + 0.5) * f;
      col = [255, 255 - flash * 130, 255 - flash * 130, 255 * alpha];
    }

    mat4.identity(_m);
    mat4.translate(_m, _m, this.x, this.y, this.z);
    mat4.rotateY(_m, _m, this.bodyYaw);
    if (deathTilt) mat4.rotateZ(_m, _m, deathTilt);
    mat4.scaleM(_m, _m, this.scale, this.scale, this.scale);

    for (let i = 0; i < parts.length; i++) {
      const entry = parts[i];
      const p = entry.part;
      let rx = p.rot[0], ry = p.rot[1], rz = p.rot[2];
      const a = p.anim;
      if (a === 'head') { ry += this.headYaw; rx += this.headPitch; }
      else if (a === 'legFL' || a === 'legL' || a === 'legBR') rx += swing * 0.9;
      else if (a === 'legFR' || a === 'legR' || a === 'legBL') rx += swing2 * 0.9;
      else if (a === 'armL') { rx += swing2 * 0.8; rz += breathe; }
      else if (a === 'armR') { rx += swing * 0.8; rz -= breathe; }
      else if (a === 'wingL') rz += Math.sin(this.idle * 9) * 0.35 * (this.onGround ? 0.25 : 1) - 0.1;
      else if (a === 'wingR') rz -= Math.sin(this.idle * 9) * 0.35 * (this.onGround ? 0.25 : 1) - 0.1;
      else if (a === 'tail') rx += Math.sin(this.idle * 3) * 0.18;
      else if (a && a.indexOf('spider') === 0) {
        const n = +a.slice(-1);
        const side = a.indexOf('L') > 0 ? 1 : -1;
        rz += Math.sin(this.walkTime * 2 + n * 1.6) * 0.32 * this.walkAmount * side;
        ry += Math.cos(this.walkTime * 2 + n * 1.6) * 0.22 * this.walkAmount;
      }
      if (this.type === 'zombie' && (a === 'armL' || a === 'armR')) rx = -1.45 + rx * 0.25;

      mat4.identity(_t);
      mat4.translate(_t, _t, p.pivot[0], p.pivot[1], p.pivot[2]);
      if (rx) mat4.rotateX(_t, _t, rx);
      if (ry) mat4.rotateY(_t, _t, ry);
      if (rz) mat4.rotateZ(_t, _t, rz);
      mat4.translate(_t, _t, p.pos[0] - p.pivot[0], p.pos[1] - p.pivot[1], p.pos[2] - p.pivot[2]);
      mat4.multiply(_r, _m, _t);

      const inf = p.inflate || 0;
      let c = col;
      if (p.alpha < 1) c = [col[0], col[1], col[2], col[3] * p.alpha];
      batch.box(_r, p.size[0] + inf * 2, p.size[1] + inf * 2, p.size[2] + inf * 2, entry.uv, c, true);
    }
  };

  MC.Mob = Mob;

  /* ============================================================
   * dropped item
   * ============================================================ */
  function ItemEntity(x, y, z, name, count) {
    this.x = x; this.y = y; this.z = z;
    this.vx = (Math.random() - 0.5) * 2.2;
    this.vy = 3 + Math.random() * 1.5;
    this.vz = (Math.random() - 0.5) * 2.2;
    this.name = name; this.count = count;
    this.w = 0.125; this.h = 0.25;
    this.age = 0; this.pickupDelay = 0.5;
    this.dead = false;
    this.onGround = false;
    this.spin = Math.random() * 6.28;
  }
  ItemEntity.prototype.update = function (dt, world, game) {
    this.age += dt;
    this.pickupDelay -= dt;
    if (this.age > 300) { this.dead = true; return; }
    const fluid = PH.fluidAt(world, this.x, this.y, this.z, this.w, this.h);
    if (fluid.water) { this.vy += 20 * dt; this.vy = clamp(this.vy, -1.5, 1.5); }
    else this.vy -= GRAVITY * dt;
    if (fluid.lava) { this.dead = true; return; }
    PH.move(world, this, this.vx * dt, this.vy * dt, this.vz * dt);
    const damp = this.onGround ? Math.pow(0.02, dt) : Math.pow(0.6, dt);
    this.vx *= damp; this.vz *= damp;
    this.spin += dt * 1.6;

    const p = game.player;
    if (this.pickupDelay <= 0 && !p.dead) {
      const d = Math.hypot(p.x - this.x, p.y + 0.9 - this.y, p.z - this.z);
      if (d < 1.6) {
        // drift toward the player before snapping in
        const k = Math.min(1, 12 * dt);
        this.x += (p.x - this.x) * k;
        this.y += (p.y + 0.6 - this.y) * k;
        this.z += (p.z - this.z) * k;
        if (d < 0.7) {
          const left = game.inventory.add(this.name, this.count);
          if (left < this.count) {
            game.audio.play('pop', 0.25);
            this.count = left;
            if (left <= 0) this.dead = true;
          }
        }
      }
    }
  };
  MC.ItemEntity = ItemEntity;

  /* ============================================================
   * XP orb
   * ============================================================ */
  function XPOrb(x, y, z, amount) {
    this.x = x; this.y = y; this.z = z;
    this.vx = (Math.random() - 0.5) * 2; this.vy = 2 + Math.random(); this.vz = (Math.random() - 0.5) * 2;
    this.amount = amount; this.w = 0.1; this.h = 0.2;
    this.age = 0; this.dead = false; this.onGround = false;
  }
  XPOrb.prototype.update = function (dt, world, game) {
    this.age += dt;
    if (this.age > 300) { this.dead = true; return; }
    this.vy -= GRAVITY * 0.5 * dt;
    const p = game.player;
    const d = Math.hypot(p.x - this.x, p.y + 0.9 - this.y, p.z - this.z);
    if (d < 5 && this.age > 0.4) {
      const k = Math.min(1, 6 * dt);
      this.x += (p.x - this.x) * k; this.y += (p.y + 0.8 - this.y) * k; this.z += (p.z - this.z) * k;
      if (d < 0.6) {
        p.addXP(this.amount);
        game.audio.play('xp', 0.2);
        this.dead = true;
        return;
      }
    }
    PH.move(world, this, this.vx * dt, this.vy * dt, this.vz * dt);
    this.vx *= Math.pow(0.2, dt); this.vz *= Math.pow(0.2, dt);
  };
  MC.XPOrb = XPOrb;

  /* ============================================================
   * arrow
   * ============================================================ */
  function Arrow(x, y, z, vx, vy, vz, owner) {
    this.x = x; this.y = y; this.z = z;
    this.vx = vx; this.vy = vy; this.vz = vz;
    this.owner = owner; this.dead = false; this.age = 0;
    this.stuck = false; this.w = 0.05; this.h = 0.1;
  }
  Arrow.prototype.update = function (dt, world, game) {
    this.age += dt;
    if (this.age > 60) { this.dead = true; return; }
    if (this.stuck) { if (this.age > 8) this.dead = true; return; }
    this.vy -= 20 * dt;
    const nx = this.x + this.vx * dt, ny = this.y + this.vy * dt, nz = this.z + this.vz * dt;
    if (MC.blocks.T.solid[world.getBlock(Math.floor(nx), Math.floor(ny), Math.floor(nz))]) {
      this.stuck = true; this.age = 0; return;
    }
    this.x = nx; this.y = ny; this.z = nz;
    // hit test against mobs and the player
    const list = game.entities;
    for (let i = 0; i < list.length; i++) {
      const e = list[i];
      if (!(e instanceof Mob) || e.dead || e === this.owner) continue;
      if (Math.abs(e.x - this.x) < e.w + 0.3 && Math.abs(e.z - this.z) < e.w + 0.3 &&
          this.y > e.y - 0.2 && this.y < e.y + e.h + 0.2) {
        e.hurt(4, game, this.owner);
        this.dead = true;
        return;
      }
    }
    const p = game.player;
    if (this.owner !== p && !p.dead &&
        Math.abs(p.x - this.x) < 0.5 && Math.abs(p.z - this.z) < 0.5 &&
        this.y > p.y - 0.2 && this.y < p.y + p.h + 0.2) {
      p.damage(3, 'arrow');
      game.audio.play('hurt', 0.4);
      this.dead = true;
    }
  };
  MC.Arrow = Arrow;

  /* ============================================================
   * particles
   * ============================================================ */
  function Particles(max) {
    this.max = max || 3000;
    this.n = 0;
    this.x = new Float32Array(this.max); this.y = new Float32Array(this.max); this.z = new Float32Array(this.max);
    this.vx = new Float32Array(this.max); this.vy = new Float32Array(this.max); this.vz = new Float32Array(this.max);
    this.life = new Float32Array(this.max); this.maxLife = new Float32Array(this.max);
    this.size = new Float32Array(this.max);
    this.u0 = new Float32Array(this.max); this.v0 = new Float32Array(this.max);
    this.u1 = new Float32Array(this.max); this.v1 = new Float32Array(this.max);
    this.r = new Uint8Array(this.max); this.g = new Uint8Array(this.max); this.b = new Uint8Array(this.max);
    this.grav = new Float32Array(this.max);
  }
  Particles.prototype.spawn = function (x, y, z, vx, vy, vz, life, size, uv, col, grav) {
    let i;
    if (this.n < this.max) i = this.n++;
    else i = (Math.random() * this.max) | 0;
    this.x[i] = x; this.y[i] = y; this.z[i] = z;
    this.vx[i] = vx; this.vy[i] = vy; this.vz[i] = vz;
    this.life[i] = life; this.maxLife[i] = life;
    this.size[i] = size;
    this.u0[i] = uv[0]; this.v0[i] = uv[1]; this.u1[i] = uv[2]; this.v1[i] = uv[3];
    this.r[i] = col ? col[0] : 255; this.g[i] = col ? col[1] : 255; this.b[i] = col ? col[2] : 255;
    this.grav[i] = grav === undefined ? 1 : grav;
  };
  // a few pixels of a block texture, for break/step puffs
  Particles.prototype.blockBurst = function (bx, by, bz, blockId, count, spread) {
    const name = MC.atlas.faceTex(MC.blocks.get(blockId), 'side');
    const uv = MC.atlas.uv[name];
    if (!uv) return;
    const s = (uv[2] - uv[0]) / 4;
    for (let i = 0; i < count; i++) {
      const cu = uv[0] + Math.floor(Math.random() * 3) * s;
      const cv = uv[1] + Math.floor(Math.random() * 3) * s;
      this.spawn(
        bx + Math.random(), by + Math.random() * 0.9, bz + Math.random(),
        (Math.random() - 0.5) * (spread || 2.4), Math.random() * 3.2, (Math.random() - 0.5) * (spread || 2.4),
        0.6 + Math.random() * 0.5, 0.09 + Math.random() * 0.05,
        [cu, cv, cu + s, cv + s], null, 1
      );
    }
  };
  Particles.prototype.update = function (dt, world) {
    const T = MC.blocks.T;
    for (let i = 0; i < this.n; i++) {
      if (this.life[i] <= 0) continue;
      this.life[i] -= dt;
      if (this.life[i] <= 0) continue;
      this.vy[i] -= 18 * this.grav[i] * dt;
      const nx = this.x[i] + this.vx[i] * dt;
      const ny = this.y[i] + this.vy[i] * dt;
      const nz = this.z[i] + this.vz[i] * dt;
      if (T.solid[world.getBlock(Math.floor(nx), Math.floor(this.y[i]), Math.floor(this.z[i]))]) { this.vx[i] = 0; }
      else this.x[i] = nx;
      if (T.solid[world.getBlock(Math.floor(this.x[i]), Math.floor(ny), Math.floor(this.z[i]))]) {
        if (this.vy[i] < 0) { this.vy[i] = 0; this.vx[i] *= 0.5; this.vz[i] *= 0.5; }
        else this.vy[i] = 0;
      } else this.y[i] = ny;
      if (T.solid[world.getBlock(Math.floor(this.x[i]), Math.floor(this.y[i]), Math.floor(nz))]) { this.vz[i] = 0; }
      else this.z[i] = nz;
    }
    // compact the tail so the array doesn't grow forever
    while (this.n > 0 && this.life[this.n - 1] <= 0) this.n--;
  };
  const _partQuad = new Float32Array(12);
  Particles.prototype.render = function (batch, camRight, camUp) {
    const p = _partQuad;
    for (let i = 0; i < this.n; i++) {
      if (this.life[i] <= 0) continue;
      const s = this.size[i] * Math.min(1, this.life[i] / 0.18);
      const rx = camRight[0] * s, ry = camRight[1] * s, rz = camRight[2] * s;
      const ux = camUp[0] * s, uy = camUp[1] * s, uz = camUp[2] * s;
      const x = this.x[i], y = this.y[i], z = this.z[i];
      p[0] = x - rx - ux; p[1] = y - ry - uy; p[2] = z - rz - uz;
      p[3] = x + rx - ux; p[4] = y + ry - uy; p[5] = z + rz - uz;
      p[6] = x + rx + ux; p[7] = y + ry + uy; p[8] = z + rz + uz;
      p[9] = x - rx + ux; p[10] = y - ry + uy; p[11] = z - rz + uz;
      batch.quad(p, [this.u0[i], this.v0[i], this.u1[i], this.v1[i]],
        [this.r[i], this.g[i], this.b[i], 255]);
    }
  };
  MC.Particles = Particles;
})();

</script>
<script>
/* ---- js/game/inventory.js ---- */
/* ============================================================
 * inventory.js - slots, stacks and the crafting grids.
 * Layout: 0-8 hotbar, 9-35 main, 36-39 armour, 40-48 crafting,
 * 49 crafting result, 50 cursor (the stack on the mouse).
 * ============================================================ */
(function () {
  'use strict';
  const MC = window.MC || (window.MC = {});

  const HOTBAR = 0, MAIN = 9, ARMOR = 36, CRAFT = 40, RESULT = 49, CURSOR = 50;
  const SIZE = 51;

  function stack(name, count, dur) {
    const t = MC.thing(name);
    if (!t) return null;
    return { name: name, count: count, dur: dur === undefined ? (t.durability || 0) : dur };
  }
  MC.stack = stack;

  function Inventory() {
    this.slots = new Array(SIZE).fill(null);
    this.craftSize = 2;              // 2x2 unless a crafting table is open
  }

  Inventory.HOTBAR = HOTBAR; Inventory.MAIN = MAIN; Inventory.ARMOR = ARMOR;
  Inventory.CRAFT = CRAFT; Inventory.RESULT = RESULT; Inventory.CURSOR = CURSOR;
  Inventory.SIZE = SIZE;

  Inventory.prototype.get = function (i) { return this.slots[i]; };
  Inventory.prototype.set = function (i, s) { this.slots[i] = s; };

  Inventory.prototype.maxStack = function (name) {
    const t = MC.thing(name);
    return t ? t.maxStack : 64;
  };

  /* Add items, hotbar first then the main grid. Returns what didn't fit. */
  Inventory.prototype.add = function (name, count) {
    const max = this.maxStack(name);
    const order = [];
    for (let i = HOTBAR; i < HOTBAR + 9; i++) order.push(i);
    for (let i = MAIN; i < MAIN + 27; i++) order.push(i);

    // top up existing stacks
    if (max > 1) {
      for (let k = 0; k < order.length && count > 0; k++) {
        const s = this.slots[order[k]];
        if (s && s.name === name && s.count < max) {
          const n = Math.min(max - s.count, count);
          s.count += n; count -= n;
        }
      }
    }
    // then fill empties
    for (let k = 0; k < order.length && count > 0; k++) {
      if (!this.slots[order[k]]) {
        const n = Math.min(max, count);
        this.slots[order[k]] = stack(name, n);
        count -= n;
      }
    }
    return count;
  };

  Inventory.prototype.has = function (name, count) {
    let n = 0;
    for (let i = 0; i < ARMOR; i++) {
      const s = this.slots[i];
      if (s && s.name === name) n += s.count;
      if (n >= count) return true;
    }
    return false;
  };

  Inventory.prototype.remove = function (name, count) {
    for (let i = 0; i < ARMOR && count > 0; i++) {
      const s = this.slots[i];
      if (!s || s.name !== name) continue;
      const n = Math.min(s.count, count);
      s.count -= n; count -= n;
      if (s.count <= 0) this.slots[i] = null;
    }
    return count === 0;
  };

  Inventory.prototype.consumeSelected = function (sel, n) {
    const s = this.slots[sel];
    if (!s) return false;
    s.count -= (n || 1);
    if (s.count <= 0) this.slots[sel] = null;
    return true;
  };

  /* Wear down a tool; returns true if it broke. */
  Inventory.prototype.damageTool = function (slot, amount) {
    const s = this.slots[slot];
    if (!s) return false;
    const t = MC.thing(s.name);
    if (!t || !t.durability) return false;
    s.dur -= amount;
    if (s.dur <= 0) { this.slots[slot] = null; return true; }
    return false;
  };

  Inventory.prototype.firstEmpty = function () {
    for (let i = HOTBAR; i < HOTBAR + 9; i++) if (!this.slots[i]) return i;
    for (let i = MAIN; i < MAIN + 27; i++) if (!this.slots[i]) return i;
    return -1;
  };

  /* Creative middle-click: put this block in hand, replacing nothing. */
  Inventory.prototype.pickBlock = function (name, sel) {
    for (let i = HOTBAR; i < HOTBAR + 9; i++) {
      if (this.slots[i] && this.slots[i].name === name) return i;
    }
    for (let i = MAIN; i < MAIN + 27; i++) {
      if (this.slots[i] && this.slots[i].name === name) {
        const t = this.slots[sel];
        this.slots[sel] = this.slots[i];
        this.slots[i] = t;
        return sel;
      }
    }
    const empty = this.slots[sel] ? -1 : sel;
    const target = empty >= 0 ? empty : sel;
    this.slots[target] = stack(name, 1);
    return target;
  };

  /* ---------------- mouse interactions ---------------- */

  // left click: pick up / put down / merge
  Inventory.prototype.clickSlot = function (i, readOnlyResult) {
    const cur = this.slots[CURSOR];
    const s = this.slots[i];
    if (readOnlyResult) {
      // crafting output: only lets you take
      if (!s) return false;
      if (!cur) { this.slots[CURSOR] = s; this.slots[i] = null; return true; }
      if (cur.name === s.name && cur.count + s.count <= this.maxStack(cur.name)) {
        cur.count += s.count; this.slots[i] = null; return true;
      }
      return false;
    }
    if (!cur) { this.slots[CURSOR] = s; this.slots[i] = null; return true; }
    if (!s) { this.slots[i] = cur; this.slots[CURSOR] = null; return true; }
    if (s.name === cur.name) {
      const max = this.maxStack(s.name);
      const n = Math.min(max - s.count, cur.count);
      if (n > 0) {
        s.count += n; cur.count -= n;
        if (cur.count <= 0) this.slots[CURSOR] = null;
        return true;
      }
    }
    this.slots[i] = cur; this.slots[CURSOR] = s;
    return true;
  };

  // right click: split a stack or place one item
  Inventory.prototype.rightClickSlot = function (i) {
    const cur = this.slots[CURSOR];
    const s = this.slots[i];
    if (!cur) {
      if (!s) return false;
      const half = Math.ceil(s.count / 2);
      this.slots[CURSOR] = stack(s.name, half, s.dur);
      s.count -= half;
      if (s.count <= 0) this.slots[i] = null;
      return true;
    }
    if (!s) {
      this.slots[i] = stack(cur.name, 1, cur.dur);
      cur.count--;
      if (cur.count <= 0) this.slots[CURSOR] = null;
      return true;
    }
    if (s.name === cur.name && s.count < this.maxStack(s.name)) {
      s.count++; cur.count--;
      if (cur.count <= 0) this.slots[CURSOR] = null;
      return true;
    }
    return false;
  };

  // shift click: hotbar <-> main, or into the inventory from crafting/armour
  Inventory.prototype.quickMove = function (i) {
    const s = this.slots[i];
    if (!s) return false;
    let from, to;
    if (i >= HOTBAR && i < HOTBAR + 9) { from = HOTBAR; to = [MAIN, MAIN + 27]; }
    else if (i >= MAIN && i < MAIN + 27) { from = MAIN; to = [HOTBAR, HOTBAR + 9]; }
    else { to = [HOTBAR, MAIN + 27]; }

    const max = this.maxStack(s.name);
    for (let k = to[0]; k < to[1] && s.count > 0; k++) {
      const d = this.slots[k];
      if (d && d.name === s.name && d.count < max) {
        const n = Math.min(max - d.count, s.count);
        d.count += n; s.count -= n;
      }
    }
    for (let k = to[0]; k < to[1] && s.count > 0; k++) {
      if (!this.slots[k]) { this.slots[k] = stack(s.name, s.count, s.dur); s.count = 0; }
    }
    if (s.count <= 0) this.slots[i] = null;
    return true;
  };

  /* ---------------- crafting ---------------- */

  Inventory.prototype.craftGrid = function () {
    const n = this.craftSize;
    const g = [];
    for (let y = 0; y < n; y++) {
      for (let x = 0; x < n; x++) {
        const s = this.slots[CRAFT + y * 3 + x];
        g.push(s ? s.name : null);
      }
    }
    return { grid: g, size: n };
  };

  Inventory.prototype.updateCraftResult = function () {
    const g = this.craftGrid();
    const r = MC.recipes.match(g.grid, g.size);
    this.slots[RESULT] = r ? stack(r.name, r.count) : null;
    this._pendingRecipe = r;
  };

  Inventory.prototype.consumeCraft = function (times) {
    times = times || 1;
    for (let t = 0; t < times; t++) {
      for (let y = 0; y < this.craftSize; y++) {
        for (let x = 0; x < this.craftSize; x++) {
          const i = CRAFT + y * 3 + x;
          const s = this.slots[i];
          if (!s) continue;
          // buckets and bowls survive being used in a recipe
          if (s.name === 'water_bucket' || s.name === 'lava_bucket' || s.name === 'milk_bucket') {
            this.slots[i] = stack('bucket', 1);
            continue;
          }
          s.count--;
          if (s.count <= 0) this.slots[i] = null;
        }
      }
    }
    this.updateCraftResult();
  };

  // how many times the current recipe can be repeated with what's in the grid
  Inventory.prototype.maxCrafts = function () {
    let m = Infinity;
    for (let y = 0; y < this.craftSize; y++) {
      for (let x = 0; x < this.craftSize; x++) {
        const s = this.slots[CRAFT + y * 3 + x];
        if (s) m = Math.min(m, s.count);
      }
    }
    return m === Infinity ? 0 : m;
  };

  // drop everything in the crafting grid back into the inventory
  Inventory.prototype.clearCraft = function () {
    const out = [];
    for (let i = CRAFT; i < CRAFT + 9; i++) {
      const s = this.slots[i];
      if (!s) continue;
      const left = this.add(s.name, s.count);
      if (left > 0) out.push({ name: s.name, count: left });
      this.slots[i] = null;
    }
    this.slots[RESULT] = null;
    const cur = this.slots[CURSOR];
    if (cur) {
      const left = this.add(cur.name, cur.count);
      if (left > 0) out.push({ name: cur.name, count: left });
      this.slots[CURSOR] = null;
    }
    return out;
  };

  Inventory.prototype.armorPoints = function () {
    let n = 0;
    for (let i = ARMOR; i < ARMOR + 4; i++) {
      const s = this.slots[i];
      if (!s) continue;
      const t = MC.thing(s.name);
      if (t && t.armor) n += t.armor.defense;
    }
    return n;
  };

  Inventory.prototype.serialize = function () {
    return this.slots.map(function (s) { return s ? [s.name, s.count, s.dur] : 0; });
  };
  Inventory.prototype.load = function (data) {
    if (!data) return;
    for (let i = 0; i < Math.min(data.length, SIZE); i++) {
      const d = data[i];
      this.slots[i] = d ? stack(d[0], d[1], d[2]) : null;
    }
  };

  MC.Inventory = Inventory;
})();

<script>
/* ---- js/game/recipes.js ---- */
/* ============================================================
 * recipes.js - crafting, smelting and furnace fuel.
 * ============================================================ */
(function () {
  'use strict';
  const MC = window.MC || (window.MC = {});

  const shaped = [];      // { rows, key, out, count }
  const shapeless = [];   // { items: [name...], out, count }

  function S(rows, key, out, count) { shaped.push({ rows: rows, key: key, out: out, count: count || 1 }); }
  function SL(items, out, count) { shapeless.push({ items: items, out: out, count: count || 1 }); }

  const WOODS = MC.WOOD_TYPES;
  const TOOLS = ['wooden', 'stone', 'iron', 'golden', 'diamond'];
  const TOOL_MAT = {
    wooden: 'oak_planks', stone: 'cobblestone', iron: 'iron_ingot',
    golden: 'gold_ingot', diamond: 'diamond'
  };

  /* ---- wood ---- */
  WOODS.forEach(function (w) {
    SL([w + '_log'], w + '_planks', 4);
    S(['##', '##'], { '#': w + '_planks' }, 'crafting_table', 1);
  });
  WOODS.forEach(function (w) {
    S(['#', '#'], { '#': w + '_planks' }, 'stick', 4);
  });

  /* ---- basics ---- */
  S(['###', '# #', '###'], { '#': 'cobblestone' }, 'furnace', 1);
  S(['###', '# #', '###'], { '#': 'oak_planks' }, 'chest', 1);
  S(['X', '#'], { X: 'coal', '#': 'stick' }, 'torch', 4);
  S(['X', '#'], { X: 'charcoal', '#': 'stick' }, 'torch', 4);
  S(['# #', '###', '# #'], { '#': 'stick' }, 'ladder', 3);
  S(['# #', ' # '], { '#': 'oak_planks' }, 'bowl', 4);
  S(['##', '##'], { '#': 'stone' }, 'stone_bricks', 4);
  S(['##', '##'], { '#': 'brick' }, 'bricks', 1);
  S(['##', '##'], { '#': 'sand' }, 'sandstone', 1);
  S(['##', '##'], { '#': 'red_sand' }, 'red_sandstone', 1);
  S(['###', '###', '###'], { '#': 'wheat' }, 'hay_block', 1);
  S(['##', '##'], { '#': 'string' }, 'white_wool', 1);
  S(['###', '###', '###'], { '#': 'melon_slice' }, 'melon', 1);
  S(['##', '##'], { '#': 'glowstone_dust' }, 'glowstone', 1);
  S(['X#X', '#X#', 'X#X'], { X: 'gunpowder', '#': 'sand' }, 'tnt', 1);
  S(['###', '#X#', '###'], { '#': 'oak_planks', X: 'book' }, 'bookshelf', 1);
  SL(['paper', 'paper', 'paper', 'leather'], 'book', 1);
  S(['###'], { '#': 'sugar_cane' }, 'paper', 3);
  SL(['sugar_cane'], 'sugar', 1);
  SL(['pumpkin', 'torch'], 'jack_o_lantern', 1);
  SL(['pumpkin', 'shears'], 'carved_pumpkin', 1);
  SL(['brown_mushroom', 'red_mushroom', 'bowl'], 'mushroom_stew', 1);
  S(['###'], { '#': 'wheat' }, 'bread', 1);
  SL(['wheat', 'wheat', 'sugar'], 'cookie', 8);
  S([' # ', '#X#', ' # '], { '#': 'iron_ingot', X: 'flint' }, 'flint_and_steel', 1);
  SL(['iron_ingot', 'flint'], 'flint_and_steel', 1);
  S(['# #', ' # '], { '#': 'iron_ingot' }, 'bucket', 1);
  S([' #', '# '], { '#': 'iron_ingot' }, 'shears', 1);
  S([' X#', 'X #', ' X#'], { X: 'stick', '#': 'string' }, 'bow', 1);
  S(['X', '#', 'F'], { X: 'flint', '#': 'stick', F: 'feather' }, 'arrow', 4);
  S(['##', '##'], { '#': 'stone_bricks' }, 'chiseled_stone_bricks', 4);
  S(['##', '##'], { '#': 'granite' }, 'polished_granite', 4);
  S(['##', '##'], { '#': 'diorite' }, 'polished_diorite', 4);
  S(['##', '##'], { '#': 'andesite' }, 'polished_andesite', 4);
  S(['##', '##'], { '#': 'sandstone' }, 'cut_sandstone', 4);
  SL(['cobblestone', 'moss_block'], 'mossy_cobblestone', 1);
  SL(['stone_bricks', 'moss_block'], 'mossy_stone_bricks', 1);
  SL(['clay_ball', 'clay_ball', 'clay_ball', 'clay_ball'], 'clay', 1);
  SL(['snowball', 'snowball', 'snowball', 'snowball'], 'snow_block', 1);

  /* ---- compact / uncompact ---- */
  const BLOCKS9 = [
    ['coal', 'coal_block'], ['iron_ingot', 'iron_block'], ['gold_ingot', 'gold_block'],
    ['diamond', 'diamond_block'], ['emerald', 'emerald_block'], ['lapis_lazuli', 'lapis_block'],
    ['redstone', 'redstone_block'], ['copper_ingot', 'copper_block']
  ];
  BLOCKS9.forEach(function (p) {
    S(['###', '###', '###'], { '#': p[0] }, p[1], 1);
    SL([p[1]], p[0], 9);
  });

  /* ---- tools, weapons, armour ---- */
  TOOLS.forEach(function (m) {
    const X = TOOL_MAT[m];
    S(['XXX', ' # ', ' # '], { X: X, '#': 'stick' }, m + '_pickaxe', 1);
    S(['XX', 'X#', ' #'], { X: X, '#': 'stick' }, m + '_axe', 1);
    S(['XX', '#X', '# '], { X: X, '#': 'stick' }, m + '_axe', 1);
    S(['X', '#', '#'], { X: X, '#': 'stick' }, m + '_shovel', 1);
    S(['XX', ' #', ' #'], { X: X, '#': 'stick' }, m + '_hoe', 1);
    S(['XX', '# ', '# '], { X: X, '#': 'stick' }, m + '_hoe', 1);
    S(['X', 'X', '#'], { X: X, '#': 'stick' }, m + '_sword', 1);
  });
  const ARMOR_MAT = { leather: 'leather', iron: 'iron_ingot', golden: 'gold_ingot', diamond: 'diamond' };
  Object.keys(ARMOR_MAT).forEach(function (m) {
    const X = ARMOR_MAT[m];
    S(['XXX', 'X X'], { X: X }, m + '_helmet', 1);
    S(['X X', 'XXX', 'XXX'], { X: X }, m + '_chestplate', 1);
    S(['XXX', 'X X', 'X X'], { X: X }, m + '_leggings', 1);
    S(['X X', 'X X'], { X: X }, m + '_boots', 1);
  });

  /* ---- wool dyeing (any wool + dye-ish item) ---- */
  const DYE_SOURCE = {
    red: 'poppy', yellow: 'dandelion', blue: 'lapis_lazuli', white: 'bone',
    green: 'cactus', brown: 'cocoa_beans', black: 'charcoal', pink: 'pink_tulip',
    orange: 'orange_tulip', light_blue: 'blue_orchid', magenta: 'allium', purple: 'allium'
  };
  Object.keys(DYE_SOURCE).forEach(function (c) {
    const src = DYE_SOURCE[c];
    if (!MC.thing(src)) return;
    SL(['white_wool', src], c + '_wool', 1);
  });

  /* ============================================================
   * matching
   * ============================================================ */

  function trim(grid, size) {
    let minX = size, minY = size, maxX = -1, maxY = -1;
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      if (grid[y * size + x]) {
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
    }
    if (maxX < 0) return null;
    const w = maxX - minX + 1, h = maxY - minY + 1;
    const out = [];
    for (let y = 0; y < h; y++) {
      const row = [];
      for (let x = 0; x < w; x++) row.push(grid[(minY + y) * size + (minX + x)]);
      out.push(row);
    }
    return { rows: out, w: w, h: h };
  }

  function keyLookup(key, ch) {
    if (ch === ' ') return null;
    return key[ch] || null;
  }

  function matchShaped(t, r) {
    const rh = r.rows.length, rw = r.rows[0].length;
    if (rh !== t.h || rw !== t.w) return false;
    for (let y = 0; y < rh; y++) {
      for (let x = 0; x < rw; x++) {
        const want = keyLookup(r.key, r.rows[y][x] || ' ');
        const got = t.rows[y][x];
        if (want === null && got === null) continue;
        if (want === null || got === null) return false;
        if (want !== got) return false;
      }
    }
    return true;
  }

  function matchShapeless(grid, r) {
    const have = grid.filter(function (n) { return n; }).slice();
    if (have.length !== r.items.length) return false;
    const want = r.items.slice();
    for (let i = 0; i < have.length; i++) {
      const j = want.indexOf(have[i]);
      if (j < 0) return false;
      want.splice(j, 1);
    }
    return true;
  }

  MC.recipes = {
    shaped: shaped,
    shapeless: shapeless,

    match: function (grid, size) {
      const t = trim(grid, size);
      if (!t) return null;
      for (let i = 0; i < shaped.length; i++) {
        const r = shaped[i];
        if (r.rows.length > size) continue;
        if (matchShaped(t, r)) return { name: r.out, count: r.count };
      }
      for (let i = 0; i < shapeless.length; i++) {
        if (matchShapeless(grid, shapeless[i])) {
          return { name: shapeless[i].out, count: shapeless[i].count };
        }
      }
      return null;
    },

    /* ---- smelting ---- */
    smelt: function (name) {
      const b = MC.blocks.byName[name];
      if (b && b.smelt) return { name: b.smelt.to, count: 1, xp: b.smelt.xp };
      const S2 = SMELT[name];
      return S2 ? { name: S2[0], count: 1, xp: S2[1] } : null;
    },

    fuel: function (name) {
      const t = MC.thing(name);
      if (!t) return 0;
      if (t.fuel) return t.fuel;
      if (t.isBlock && /planks|_log$|bookshelf|crafting_table|chest|wool/.test(name)) return 300;
      if (name === 'lava_bucket') return 20000;
      return 0;
    },

    /* every recipe that produces this item, for the recipe book */
    producing: function (name) {
      const out = [];
      for (let i = 0; i < shaped.length; i++) if (shaped[i].out === name) out.push({ type: 'shaped', r: shaped[i] });
      for (let i = 0; i < shapeless.length; i++) if (shapeless[i].out === name) out.push({ type: 'shapeless', r: shapeless[i] });
      return out;
    }
  };

  const SMELT = {
    raw_iron: ['iron_ingot', 0.7], raw_gold: ['gold_ingot', 1.0], raw_copper: ['copper_ingot', 0.7],
    beef: ['cooked_beef', 0.35], porkchop: ['cooked_porkchop', 0.35],
    chicken: ['cooked_chicken', 0.35], mutton: ['cooked_mutton', 0.35],
    potato: ['baked_potato', 0.35], clay_ball: ['brick', 0.3],
    sand: ['glass', 0.1], red_sand: ['glass', 0.1], cobblestone: ['stone', 0.1],
    stone: ['smooth_stone', 0.1], clay: ['terracotta', 0.35],
    oak_log: ['charcoal', 0.15], birch_log: ['charcoal', 0.15], spruce_log: ['charcoal', 0.15],
    jungle_log: ['charcoal', 0.15], acacia_log: ['charcoal', 0.15], dark_oak_log: ['charcoal', 0.15],
    coal_ore: ['coal', 0.1], iron_ore: ['iron_ingot', 0.7], gold_ore: ['gold_ingot', 1.0],
    copper_ore: ['copper_ingot', 0.7], diamond_ore: ['diamond', 1.0], emerald_ore: ['emerald', 1.0],
    lapis_ore: ['lapis_lazuli', 0.2], redstone_ore: ['redstone', 0.7],
    deepslate_iron_ore: ['iron_ingot', 0.7], deepslate_gold_ore: ['gold_ingot', 1.0],
    deepslate_diamond_ore: ['diamond', 1.0], deepslate_emerald_ore: ['emerald', 1.0],
    cactus: ['green_dye', 0.2], mud: ['terracotta', 0.1]
  };
  // drop entries whose product doesn't exist in this build
  Object.keys(SMELT).forEach(function (k) { if (!MC.thing(SMELT[k][0])) delete SMELT[k]; });
})();
