      box('legBR', [4, 6, 4], [2, 3, 4], [0, 16], { anim: 'legBR', pivot: [2, 6, 4] })
    ],
    tex: function (c, s) {
      s.fillAll(0x4c9c3d, true);
      // the classic face
      s.face('head', 'zn', function (cv, x, y, w, h) {
        const F = 0x0d1a0d;
        cv.rect(x + 2, y + 2, 2, 2, F); cv.rect(x + 4, y + 2, 2, 2, F);
        cv.rect(x + 2, y + 2, 2, 2, F);
        cv.rect(x + 1, y + 2, 2, 2, F); cv.rect(x + 5, y + 2, 2, 2, F);
        cv.rect(x + 3, y + 4, 2, 3, F);
        cv.rect(x + 2, y + 5, 4, 2, F);
        cv.rect(x + 2, y + 7, 1, 1, F); cv.rect(x + 5, y + 7, 1, 1, F);
      });
      // mottled camouflage
      const faces = ['yp', 'xn', 'xp', 'zp'];
      for (let f = 0; f < faces.length; f++) {
        const r = s.rect('body', faces[f]);
        if (!r) continue;
        for (let i = 0; i < 16; i++) c.set(r[0] + c.rng.int(r[2]), r[1] + c.rng.int(r[3]), c.rng.chance(0.5) ? 0x3c7a30 : 0x66b34c);
      }
    }
  });

  /* ---- spider ---- */
  mob('spider', {
    width: 1.4, height: 0.9, health: 16, speed: 1.5, damage: 2, hostile: true, xp: 5,
    drops: [['string', 0, 2]],
    model: (function () {
      const parts = [
        box('body', [10, 8, 12], [0, 9, 3], [0, 12]),
        box('head', [8, 8, 8], [0, 9, -7], [32, 4], { anim: 'head', pivot: [0, 9, -3] }),
        box('rear', [6, 6, 6], [0, 9, 11], [0, 0])
      ];
      const zs = [-3, -1, 1, 3];
      for (let i = 0; i < 4; i++) {
        parts.push(box('legL' + i, [14, 1.4, 1.4], [-8, 9, zs[i] + 2], [18, 0],
          { anim: 'spiderL' + i, pivot: [-4, 9, zs[i] + 2], rot: [0, (i - 1.5) * 0.28, 0.32] }));
        parts.push(box('legR' + i, [14, 1.4, 1.4], [8, 9, zs[i] + 2], [18, 0],
          { anim: 'spiderR' + i, pivot: [4, 9, zs[i] + 2], rot: [0, -(i - 1.5) * 0.28, -0.32] }));
      }
      return parts;
    })(),
    tex: function (c, s) {
      s.fillAll(0x2a2018, true);
      s.fillPart('head', 0x241a14);
      s.face('head', 'zn', function (cv, x, y, w, h) {
        const E = 0xb02020;
        cv.rect(x + 1, y + 2, 2, 2, E); cv.rect(x + 5, y + 2, 2, 2, E);
        cv.set(x + 3, y + 1, E); cv.set(x + 4, y + 1, E);
      });
    }
  });

  /* ---- enderman ---- */
  mob('enderman', {
    width: 0.6, height: 2.9, health: 40, speed: 1.4, damage: 7, hostile: true, xp: 10,
    arms: true, drops: [['ender_pearl', 0, 1]],
    model: [
      box('head', [8, 8, 8], [0, 42, 0], [0, 0], { anim: 'head', pivot: [0, 38, 0] }),
      box('body', [8, 12, 4], [0, 32, 0], [16, 16]),
      box('armL', [2, 26, 2], [-5, 25, 0], [40, 16], { anim: 'armL', pivot: [-5, 37, 0] }),
      box('armR', [2, 26, 2], [5, 25, 0], [40, 16], { anim: 'armR', pivot: [5, 37, 0] }),
      box('legL', [2, 26, 2], [-2, 13, 0], [0, 16], { anim: 'legL', pivot: [-2, 26, 0] }),
      box('legR', [2, 26, 2], [2, 13, 0], [0, 16], { anim: 'legR', pivot: [2, 26, 0] })
    ],
    tex: function (c, s) {
      s.fillAll(0x141419, true);
      s.face('head', 'zn', function (cv, x, y, w, h) {
        for (let i = 0; i < 3; i++) {
          cv.set(x + 1 + i, y + 3, 0xd8b0ff); cv.set(x + 1 + i, y + 4, 0xe8d0ff);
          cv.set(x + 4 + i, y + 3, 0xd8b0ff); cv.set(x + 4 + i, y + 4, 0xe8d0ff);
        }
      });
    }
  });

  /* ---- villager ---- */
  mob('villager', {
    width: 0.6, height: 1.95, health: 20, speed: 0.9, xp: 1,
    arms: true, drops: [['emerald', 0, 1]],
    model: humanoid(),
    tex: function (c, s) {
      s.fillAll(0x8a6a4a, true);
      s.fillPart('body', 0x7a5a3a, true);
      s.fillPart('head', 0xb08968, true);
      s.face('head', 'zn', function (cv, x, y, w, h) {
        // big nose
        cv.rect(x + 3, y + 3, 2, 3, 0x9a7050);
        cv.set(x + 1, y + 2, 0xffffff); cv.set(x + 2, y + 2, 0x2a4a8a);
        cv.set(x + 6, y + 2, 0xffffff); cv.set(x + 5, y + 2, 0x2a4a8a);
        for (let i = 0; i < w; i++) { cv.set(x + i, y, 0x4a3520); cv.set(x + i, y + 1, 0x4a3520); }
      });
      s.fillPart('armL', 0x7a5a3a); s.fillPart('armR', 0x7a5a3a);
      s.fillPart('legL', 0x4a3a5a); s.fillPart('legR', 0x4a3a5a);
    }
  });

  /* ---- slime ---- */
  mob('slime', {
    width: 0.8, height: 0.8, health: 8, speed: 0.8, damage: 2, hostile: true, xp: 3,
    drops: [['slimeball', 0, 2]],
    model: [
      box('inner', [6, 6, 6], [0, 5, 0], [0, 16]),
      box('body', [10, 10, 10], [0, 5, 0], [0, 0], { alpha: 0.72, layer: 1 })
    ],
    tex: function (c, s) {
      s.fillAll(0x6fbf4a, true);
      s.fillPart('inner', 0x3a7a24);
      s.face('body', 'zn', function (cv, x, y, w, h) {
        cv.rect(x + 2, y + 3, 2, 2, 0x1c3a12); cv.rect(x + 6, y + 3, 2, 2, 0x1c3a12);
        cv.rect(x + 4, y + 6, 2, 1, 0x1c3a12);
      });
    }
  });

  /* ---- player ---- */
  mob('player', {
    width: 0.6, height: 1.8, health: 20, speed: 1.0, xp: 0, arms: true,
    model: humanoid(),
    tex: function (c, s) {
      s.fillAll(0x00a0a0, true);              // teal shirt, the classic look
      s.fillPart('head', 0xc99a72, true);
      s.face('head', 'zn', function (cv, x, y, w, h) {
        for (let i = 0; i < w; i++) { cv.set(x + i, y, 0x2b1d10); cv.set(x + i, y + 1, 0x2b1d10); }
        cv.set(x + 2, y + 3, 0xffffff); cv.set(x + 5, y + 3, 0xffffff);
        cv.set(x + 2, y + 4, 0x3a2a8a); cv.set(x + 5, y + 4, 0x3a2a8a);
        cv.rect(x + 3, y + 6, 2, 1, 0x8a5a44);
      });
      s.face('head', 'yp', function (cv, x, y, w, h) {
        for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) cv.set(x + i, y + j, 0x2b1d10);
      });
      s.face('head', 'zp', function (cv, x, y, w, h) {
        for (let j = 0; j < h - 2; j++) for (let i = 0; i < w; i++) cv.set(x + i, y + j, 0x2b1d10);
      });
      s.fillPart('armL', 0x00a0a0); s.fillPart('armR', 0x00a0a0);
      s.face('armL', 'yn', function (cv, x, y, w, h) { cv.rect(x, y, w, h, 0xc99a72); });
      s.face('armR', 'yn', function (cv, x, y, w, h) { cv.rect(x, y, w, h, 0xc99a72); });
      s.fillPart('legL', 0x2a3a8a); s.fillPart('legR', 0x2a3a8a);
    }
  });

  /* ------------------------------------------------------------------
   * Hand-placed UV offsets are easy to get wrong: a box unwraps to
   * 2*(w+d) by (h+d) texels, which overflows the skin as soon as a part
   * gets big. So every part is packed automatically instead.
   * ------------------------------------------------------------------ */
  function packModel(model, width, height) {
    const boxes = model.map(function (p, i) {
      const t = texDims(p);
      return { part: p, i: i, w: 2 * (t[0] + t[2]) + 1, h: t[1] + t[2] + 1 };
    });
    boxes.sort(function (a, b) { return b.h - a.h || b.w - a.w; });
    let x = 0, y = 0, shelf = 0;
    for (let i = 0; i < boxes.length; i++) {
      const b = boxes[i];
      if (x + b.w > width) { x = 0; y += shelf; shelf = 0; }
      if (y + b.h > height) return false;
      b.part.uv = [x, y];
      x += b.w;
      if (b.h > shelf) shelf = b.h;
    }
    return true;
  }

  /* ============================================================
   * bake all the skins into one atlas
   * ============================================================ */
  MC.mobArt.build = function () {
    const names = Object.keys(MOBS);
    const cols = Math.ceil(Math.sqrt(names.length));
    let size = 1; while (size < cols * TEXW) size *= 2;
    const realCols = Math.floor(size / TEXW);
    const data = new Uint8Array(size * size * 4);
    const uvOrigin = {};

    for (let i = 0; i < names.length; i++) {
      const name = names[i], m = MOBS[name];
      if (!packModel(m.model, TEXW, TEXH)) {
        console.warn('mob skin too small for', name);
      }
      const c = new MC.paint.Canvas(TEXW, MC.hashSeed('mob:' + name));
      const skin = new Skin(c, m.model);
      try { m.tex(c, skin); }
      catch (e) { c.fill(0xff00ff); console.warn('mob skin failed:', name, e); }
      const col = i % realCols, row = (i / realCols) | 0;
      const ox = col * TEXW, oy = row * TEXH;
      for (let y = 0; y < TEXH; y++) for (let x = 0; x < TEXW; x++) {
        const s = (y * TEXW + x) * 4, d = ((oy + y) * size + ox + x) * 4;
        data[d] = c.data[s]; data[d + 1] = c.data[s + 1];
        data[d + 2] = c.data[s + 2]; data[d + 3] = c.data[s + 3];
      }
      uvOrigin[name] = [ox / size, oy / size];
      m.atlasOrigin = uvOrigin[name];
      m.atlasScale = 1 / size;
      // precompute the six uv rects for every part, in atlas space
      m.parts = m.model.map(function (p) {
        const r = uvRects(p);
        const out = { part: p, uv: {} };
        ['xn', 'xp', 'yp', 'yn', 'zn', 'zp'].forEach(function (f) {
          const q = r[f];
          out.uv[f] = [
            (ox + q[0]) / size, (oy + q[1]) / size,
            (ox + q[0] + q[2]) / size, (oy + q[1] + q[3]) / size
          ];
        });
        return out;
      });
    }
    MC.mobArt.pixels = data;
    MC.mobArt.size = size;
    return data;
  };
})();

</script>
<script>
/* ---- js/engine/gl.js ---- */
/* ============================================================
 * gl.js - thin WebGL wrapper: programs, textures, buffers.
 * ============================================================ */
(function () {
  'use strict';
  const MC = window.MC || (window.MC = {});

  const G = {};
  MC.glu = G;

  G.getContext = function (canvas) {
    const opts = {
      alpha: false, antialias: false, depth: true, stencil: false,
      powerPreference: 'high-performance', preserveDrawingBuffer: false,
      failIfMajorPerformanceCaveat: false
    };
    let gl = canvas.getContext('webgl2', opts);
    let isGL2 = !!gl;
    if (!gl) gl = canvas.getContext('webgl', opts) || canvas.getContext('experimental-webgl', opts);
    if (!gl) return null;
    gl.isGL2 = isGL2;
    return gl;
  };

  function compileShader(gl, type, src, label) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(s);
      console.error('Shader compile failed (' + label + '):\n' + log + '\n---\n' +
        src.split('\n').map(function (l, i) { return (i + 1) + ': ' + l; }).join('\n'));
      throw new Error('Shader compile failed: ' + label);
    }
    return s;
  }

  // Creates a program and eagerly caches every active uniform/attribute location.
  G.program = function (gl, vsSrc, fsSrc, label) {
    const p = gl.createProgram();
    gl.attachShader(p, compileShader(gl, gl.VERTEX_SHADER, vsSrc, label + '.vert'));
    gl.attachShader(p, compileShader(gl, gl.FRAGMENT_SHADER, fsSrc, label + '.frag'));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      throw new Error('Program link failed (' + label + '): ' + gl.getProgramInfoLog(p));
    }
    const prog = { id: p, u: {}, a: {}, gl: gl, name: label };
    const nu = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < nu; i++) {
      const info = gl.getActiveUniform(p, i);
      const nm = info.name.replace(/\[0\]$/, '');
      prog.u[nm] = gl.getUniformLocation(p, nm);
    }
    const na = gl.getProgramParameter(p, gl.ACTIVE_ATTRIBUTES);
    for (let i = 0; i < na; i++) {
      const info = gl.getActiveAttrib(p, i);
      prog.a[info.name] = gl.getAttribLocation(p, info.name);
    }
    prog.use = function () { gl.useProgram(p); return prog; };
    return prog;
  };

  G.texture = function (gl, pixels, size, opts) {
    opts = opts || {};
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, size, size, 0, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
    if (opts.mipmap) {
      gl.generateMipmap(gl.TEXTURE_2D);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST_MIPMAP_LINEAR);
      if (gl.isGL2) gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAX_LEVEL, 4);
    } else {
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    }
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
  };

  /* Vertex attribute arrays are global state, not per-program: an array left
   * enabled by one program still feeds the next draw and, if its buffer is
   * too small, makes the draw fail with INVALID_OPERATION. So every pass
   * declares exactly which locations it wants and the rest get switched off. */
  const MAX_ATTRIBS = 8;

  G.enableOnly = function (gl, locs) {
    for (let i = 0; i < MAX_ATTRIBS; i++) {
      if (locs.indexOf(i) >= 0) gl.enableVertexAttribArray(i);
      else gl.disableVertexAttribArray(i);
    }
  };

  // Interleaved attribute layout helper.
  // spec: [{ name, size, type, norm, offset }], stride in bytes
  G.bindAttribs = function (gl, prog, spec, stride, baseOffset) {
    baseOffset = baseOffset || 0;
    const used = [];
    for (let i = 0; i < spec.length; i++) {
      const s = spec[i];
      const loc = prog.a[s.name];
      if (loc === undefined || loc < 0) continue;
      used.push(loc);
    }
    G.enableOnly(gl, used);
    for (let i = 0; i < spec.length; i++) {
      const s = spec[i];
      const loc = prog.a[s.name];
      if (loc === undefined || loc < 0) continue;
      gl.vertexAttribPointer(loc, s.size, s.type, !!s.norm, stride, s.offset + baseOffset);
    }
  };
})();

</script>
<script>
/* ---- js/engine/shaders.js ---- */
/* ============================================================
 * shaders.js - GLSL source for every render pass.
 * Written against GLSL ES 1.00 so it runs on WebGL1 and WebGL2.
 * ============================================================ */
(function () {
  'use strict';
  const MC = window.MC || (window.MC = {});

  const FOG_FN = [
    'float fogFactor(float d){',
    '  float f = clamp((d - uFogStart) / max(0.001, uFogEnd - uFogStart), 0.0, 1.0);',
    '  return f * f;',
    '}'
  ].join('\n');

  /* ---------------- terrain ---------------- */
  const TERRAIN_VS = [
    'precision highp float;',
    'attribute vec3 aPos;',     // 1/16-block fixed point, chunk local
    'attribute vec2 aUV;',
    'attribute vec4 aLight;',   // r=sky g=blocklight b=ao a=wave amount
    'attribute vec4 aTint;',
    'uniform mat4 uVP;',
    'uniform vec3 uChunkOrigin;',
    'uniform vec3 uCam;',
    'uniform float uTime;',
    'varying vec2 vUV;',
    'varying vec3 vTint;',
    'varying float vSky;',
    'varying float vBlock;',
    'varying float vAO;',
    'varying float vDist;',
    'varying vec3 vWorld;',
    'void main(){',
    '  vec3 p = aPos * 0.0625 + uChunkOrigin;',
    '  float wave = aLight.a;',
    '  if (wave > 0.004) {',
    '    float t = uTime * 2.6;',
    '    p.x += sin(t + p.x * 0.7 + p.z * 0.9) * wave * 0.13;',
    '    p.z += cos(t * 0.85 + p.z * 0.6 + p.y * 1.1) * wave * 0.13;',
    '    p.y += sin(t * 1.4 + p.x * 1.3) * wave * 0.05;',
    '  }',
    '  vWorld = p;',
    '  vUV = aUV;',
    '  vTint = aTint.rgb;',
    '  vSky = aLight.r; vBlock = aLight.g; vAO = aLight.b;',
    '  vDist = length(p - uCam);',
    '  gl_Position = uVP * vec4(p, 1.0);',
    '}'
  ].join('\n');

  const TERRAIN_FS = [
    'precision highp float;',
    'uniform sampler2D uAtlas;',
    'uniform vec3 uFogColor;',
    'uniform float uFogStart, uFogEnd;',
    'uniform float uDayLight;',
    'uniform float uAlphaTest;',
    'uniform float uOpacity;',
    'uniform float uTime;',
    'uniform vec3 uSunDir;',
    'varying vec2 vUV;',
    'varying vec3 vTint;',
    'varying float vSky, vBlock, vAO, vDist;',
    'varying vec3 vWorld;',
    FOG_FN,
    'void main(){',
    '  vec4 c = texture2D(uAtlas, vUV);',
    '  if (c.a < uAlphaTest) discard;',
    '  vec3 col = c.rgb * vTint;',
    '  float sky = vSky * uDayLight;',
    '  float lv = max(sky, vBlock);',
    '  // warm the block-light contribution slightly, like torchlight',
    '  vec3 tintedLight = mix(vec3(1.0, 0.86, 0.68), vec3(1.0), clamp(sky / max(lv, 0.001), 0.0, 1.0));',
    '  col *= (0.045 + 0.955 * lv) * vAO * tintedLight;',
    '  col = mix(col, uFogColor, fogFactor(vDist));',
    '  gl_FragColor = vec4(col, c.a * uOpacity);',
    '}'
  ].join('\n');

  /* ---------------- entities / particles / held item ---------------- */
  const ENTITY_VS = [
    'precision highp float;',
    'attribute vec3 aPos;',
    'attribute vec2 aUV;',
    'attribute vec4 aColor;',
    'uniform mat4 uVP;',
    'uniform vec3 uCam;',
    'varying vec2 vUV;',
    'varying vec4 vColor;',
    'varying float vDist;',
    'void main(){',
    '  vUV = aUV; vColor = aColor;',
    '  vDist = length(aPos - uCam);',
    '  gl_Position = uVP * vec4(aPos, 1.0);',
    '}'
  ].join('\n');

  const ENTITY_FS = [
    'precision highp float;',
    'uniform sampler2D uTex;',
    'uniform vec3 uFogColor;',
    'uniform float uFogStart, uFogEnd;',
    'uniform float uAlphaTest;',
    'uniform float uFogAmount;',
    'uniform vec4 uOverlay;',   // flash colour (damage tint) rgb + strength
    'varying vec2 vUV;',
    'varying vec4 vColor;',
    'varying float vDist;',
    FOG_FN,
    'void main(){',
    '  vec4 t = texture2D(uTex, vUV);',
    '  if (t.a < uAlphaTest) discard;',
    '  vec4 c = t * vColor;',
    '  c.rgb = mix(c.rgb, uOverlay.rgb, uOverlay.a);',
    '  c.rgb = mix(c.rgb, uFogColor, fogFactor(vDist) * uFogAmount);',
    '  gl_FragColor = c;',
    '}'
  ].join('\n');

  /* ---------------- sky: gradient + sun + moon + stars + clouds ---------------- */
  const SKY_VS = [
    'precision highp float;',
    'attribute vec2 aPos;',
    'uniform mat4 uInvVP;',
    'uniform vec3 uCam;',
    'varying vec3 vRay;',
    'void main(){',
    '  vec4 near = uInvVP * vec4(aPos, -1.0, 1.0);',
    '  vec4 far  = uInvVP * vec4(aPos,  1.0, 1.0);',
    '  vRay = normalize(far.xyz / far.w - near.xyz / near.w);',
    '  gl_Position = vec4(aPos, 0.9999, 1.0);',
    '}'
  ].join('\n');

  const SKY_FS = [
    'precision highp float;',
    'uniform vec3 uSkyTop, uSkyHorizon, uFogColor;',
    'uniform vec3 uSunDir;',
    'uniform float uDayLight;',
    'uniform float uTime;',
    'uniform vec3 uCam;',
    'uniform float uCloudCover;',
    'varying vec3 vRay;',
    'float hash21(vec2 p){',
    '  p = fract(p * vec2(233.34, 851.73));',
    '  p += dot(p, p + 23.45);',
    '  return fract(p.x * p.y);',
    '}',
    'float vnoise(vec2 p){',
    '  vec2 i = floor(p), f = fract(p);',
    '  f = f * f * (3.0 - 2.0 * f);',
    '  float a = hash21(i), b = hash21(i + vec2(1.0, 0.0));',
    '  float c = hash21(i + vec2(0.0, 1.0)), d = hash21(i + vec2(1.0, 1.0));',
    '  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);',
    '}',
    'float fbm(vec2 p){',
    '  float s = 0.0, a = 0.5;',
    '  for (int i = 0; i < 4; i++) { s += a * vnoise(p); p *= 2.03; a *= 0.5; }',
    '  return s;',
    '}',
    'void main(){',
    '  vec3 r = normalize(vRay);',
    '  float h = clamp(r.y, -1.0, 1.0);',
    '  float t = pow(clamp(h, 0.0, 1.0), 0.65);',
    '  vec3 col = mix(uSkyHorizon, uSkyTop, t);',
    '  if (h < 0.0) col = mix(uSkyHorizon, uFogColor * 0.75, clamp(-h * 3.0, 0.0, 1.0));',
    '  // stars (fade in at night)',
    '  float night = clamp(1.0 - uDayLight * 1.6, 0.0, 1.0);',
    '  if (night > 0.01 && h > -0.02) {',
    '    vec2 sp = r.xz / max(0.08, abs(r.y) + 0.25) * 26.0;',
    '    float st = hash21(floor(sp));',
    '    float tw = 0.6 + 0.4 * sin(uTime * 2.0 + st * 40.0);',
    '    float star = smoothstep(0.9955, 0.9995, st) * tw;',
    '    col += vec3(star) * night * 1.6;',
    '  }',
    '  // sun',
    '  float sd = dot(r, uSunDir);',
    '  col += vec3(1.0, 0.94, 0.78) * pow(max(sd, 0.0), 900.0) * 6.0;',
    '  col += vec3(1.0, 0.72, 0.36) * pow(max(sd, 0.0), 12.0) * 0.34 * uDayLight;',
    '  // moon (opposite the sun)',
    '  float md = dot(r, -uSunDir);',
    '  col += vec3(0.88, 0.90, 1.0) * pow(max(md, 0.0), 1400.0) * 5.0 * night;',
    '  // a flat layer of drifting blocky clouds',
    '  if (r.y > 0.07) {',
    '    float planeY = 150.0;',
    '    float dist = (planeY - uCam.y) / r.y;',
    '    if (dist > 0.0) {',
    '      vec2 world = uCam.xz + r.xz * dist + vec2(uTime * 1.7, uTime * 0.6);',
    '      vec2 cp = world * 0.014;',
    '      float n = fbm(cp);',
    '      float cov = smoothstep(0.58 - uCloudCover * 0.26, 0.74, n);',
    '      // clouds fade out where the plane is grazed, which is where a flat',
    '      // layer sampled per-pixel would otherwise alias into streaks',
    '      float fade = (1.0 - smoothstep(260.0, 1100.0, dist)) * smoothstep(0.07, 0.30, r.y);',
    '      vec3 cl = mix(vec3(0.52, 0.57, 0.68), vec3(1.0), uDayLight);',
    '      col = mix(col, cl, cov * fade * 0.8);',
    '    }',
    '  }',
    '  gl_FragColor = vec4(col, 1.0);',
    '}'
  ].join('\n');

  /* ---------------- flat coloured lines (block outline, debug) ---------------- */
  const LINE_VS = [
    'precision highp float;',
    'attribute vec3 aPos;',
    'uniform mat4 uVP;',
    'void main(){ gl_Position = uVP * vec4(aPos, 1.0); }'
  ].join('\n');

  const LINE_FS = [
    'precision highp float;',
    'uniform vec4 uColor;',
    'void main(){ gl_FragColor = uColor; }'
  ].join('\n');

  MC.shaders = {
    TERRAIN_VS, TERRAIN_FS,
    ENTITY_VS, ENTITY_FS,
    SKY_VS, SKY_FS,
    LINE_VS, LINE_FS
  };
})();

/* ---- js/engine/input.js ---- */
/* ============================================================
 * input.js - keyboard, mouse, pointer lock and key bindings.
 * ============================================================ */
(function () {
  'use strict';
  const MC = window.MC || (window.MC = {});

  const DEFAULT_BINDS = {
    forward: ['KeyW', 'ArrowUp'],
    back: ['KeyS', 'ArrowDown'],
    left: ['KeyA', 'ArrowLeft'],
    right: ['KeyD', 'ArrowRight'],
    jump: ['Space'],
    sneak: ['ShiftLeft', 'ShiftRight'],
    sprint: ['ControlLeft', 'KeyR'],
    inventory: ['KeyE'],
    drop: ['KeyQ'],
    chat: ['KeyT'],
    perspective: ['F5'],
    debug: ['F3'],
    fullscreen: ['F11'],
    screenshot: ['F2']
  };

  function Input(canvas) {
    this.canvas = canvas;
    this.binds = JSON.parse(JSON.stringify(DEFAULT_BINDS));
    this.keys = Object.create(null);
    this.pressedThisFrame = Object.create(null);
    this.mouse = { dx: 0, dy: 0, left: false, right: false, middle: false, wheel: 0 };
    this.locked = false;
    this.lockBlocked = false;   // pointer lock refused (common inside an iframe)
    this.dragging = false;
    this.dragDist = 0;
    this.sensitivity = 0.0022;
    this.invertY = false;
    this.enabled = true;
    this.onKey = null;         // (code, event) -> boolean (true = handled)
    this.onLockChange = null;
    this.onMouseDown = null;
    this.onWheel = null;
    this._install();
  }

  Input.prototype._install = function () {
    const self = this;

    window.addEventListener('keydown', function (e) {
      if (e.repeat) {
        if (!/^F\d/.test(e.code)) return;
      }
      if (e.code === 'F11') return;              // let the browser handle it
      if (self.onKey && self.onKey(e.code, e)) { e.preventDefault(); return; }
      self.keys[e.code] = true;
      self.pressedThisFrame[e.code] = true;
      if (['Space', 'Tab', 'F3', 'F5', 'F2', 'KeyE', 'Slash'].indexOf(e.code) >= 0) e.preventDefault();
    });

    window.addEventListener('keyup', function (e) {
      self.keys[e.code] = false;
    });

    window.addEventListener('blur', function () { self.keys = Object.create(null); });

    document.addEventListener('pointerlockchange', function () {
      self.locked = document.pointerLockElement === self.canvas;
      if (self.locked) self.lockBlocked = false;
      if (!self.locked) { self.mouse.left = false; self.mouse.right = false; self.dragging = false; }
      if (self.onLockChange) self.onLockChange(self.locked);
    });

    this.canvas.addEventListener('mousemove', function (e) {
      if (self.locked) {
        self.mouse.dx += e.movementX || 0;
        self.mouse.dy += e.movementY || 0;
        return;
      }
      // Fallback when pointer lock is unavailable: drag to look. Holding the
      // button still means "mine", so a click that doesn't move keeps digging
      // and anything past a few pixels turns into a look instead.
      if (!self.dragging) return;
      const dx = e.movementX || 0, dy = e.movementY || 0;
      self.dragDist += Math.abs(dx) + Math.abs(dy);
      if (self.dragDist > 6) self.mouse.left = false;
      self.mouse.dx += dx;
      self.mouse.dy += dy;
    });

    this.canvas.addEventListener('mousedown', function (e) {
      if (self.onMouseDown && self.onMouseDown(e.button, e)) return;
      if (!self.locked && !self.lockBlocked) return;
      if (e.button === 0) { self.mouse.left = true; self.dragging = true; self.dragDist = 0; }
      if (e.button === 1) { self.mouse.middle = true; e.preventDefault(); }
      if (e.button === 2) { self.mouse.right = true; self.dragging = true; self.dragDist = 0; }
    });

    window.addEventListener('mouseup', function (e) {
      if (e.button === 0) self.mouse.left = false;
      if (e.button === 1) self.mouse.middle = false;
      if (e.button === 2) self.mouse.right = false;
      if (e.button === 0 || e.button === 2) self.dragging = false;
    });

    this.canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    window.addEventListener('wheel', function (e) {
      if (self.onWheel && self.onWheel(e)) return;
      if (!self.locked && !self.lockBlocked) return;
      self.mouse.wheel += Math.sign(e.deltaY);
      e.preventDefault();
    }, { passive: false });
  };

  Input.prototype.requestLock = function () {
    const self = this;
    if (!this.canvas.requestPointerLock) { this.markLockBlocked(); return; }
    let r;
    try { r = this.canvas.requestPointerLock(); }
    catch (e) { this.markLockBlocked(); return; }
    // Chrome returns a promise that rejects when the frame disallows it.
    if (r && typeof r.catch === 'function') r.catch(function () { self.markLockBlocked(); });
    // Some browsers just do nothing at all, so check whether it took.
    setTimeout(function () {
      if (!self.locked && document.pointerLockElement !== self.canvas) self.markLockBlocked();
    }, 400);
  };

  Input.prototype.markLockBlocked = function () {
    if (this.lockBlocked) return;
    this.lockBlocked = true;
    if (this.onLockBlocked) this.onLockBlocked();
  };
  Input.prototype.exitLock = function () {
    if (document.exitPointerLock) document.exitPointerLock();
  };

  Input.prototype.down = function (action) {
    const list = this.binds[action];
    if (!list) return false;
    for (let i = 0; i < list.length; i++) if (this.keys[list[i]]) return true;
    return false;
  };

  Input.prototype.pressed = function (action) {
    const list = this.binds[action];
    if (!list) return false;
    for (let i = 0; i < list.length; i++) if (this.pressedThisFrame[list[i]]) return true;
    return false;
  };

  Input.prototype.keyPressed = function (code) { return !!this.pressedThisFrame[code]; };

  Input.prototype.consumeMouse = function () {
    const dx = this.mouse.dx, dy = this.mouse.dy;
    this.mouse.dx = 0; this.mouse.dy = 0;
    return { dx: dx, dy: dy };
  };

  Input.prototype.endFrame = function () {
    this.pressedThisFrame = Object.create(null);
    this.mouse.wheel = 0;
  };

  MC.Input = Input;
  MC.DEFAULT_BINDS = DEFAULT_BINDS;
})();

</script>

/* ---- js/world/worldgen.js ---- */
/* ============================================================
 * worldgen.js - infinite terrain: climate -> height -> biome,
 * caves, ores, then surface decoration (trees, plants, lakes).
 * ============================================================ */
(function () {
  'use strict';
  const MC = window.MC || (window.MC = {});
  const B = MC.blocks;
  const clamp = MC.math.clamp;

  const CX = 16, CZ = 16, CY = 160, SEA = 64;
  MC.CHUNK = { X: CX, Z: CZ, Y: CY, SEA: SEA, SIZE: CX * CZ * CY };
  MC.idx = function (x, y, z) { return (y << 8) | (z << 4) | x; };

  function WorldGen(seed) {
    this.seed = seed >>> 0;
    const s = this.seed;
    const P = MC.Perlin;
    this.nContinent = new P(s + 1);
    this.nErosion = new P(s + 2);
    this.nTemp = new P(s + 3);
    this.nHumid = new P(s + 4);
    this.nWeird = new P(s + 5);
    this.nDetail = new P(s + 6);
    this.nCave1 = new P(s + 7);
    this.nCave2 = new P(s + 8);
    this.nCheese = new P(s + 9);
    this.nRiver = new P(s + 10);
    this.nDeep = new P(s + 11);
    this.nBand = new P(s + 12);
    this.nSurface = new P(s + 13);

    // ids cached once - the inner loops run millions of times
    this.ID = {
      air: 0,
      stone: B.idOf('stone'), dirt: B.idOf('dirt'), grass: B.idOf('grass_block'),
      sand: B.idOf('sand'), red_sand: B.idOf('red_sand'), gravel: B.idOf('gravel'),
      water: B.idOf('water'), lava: B.idOf('lava'), bedrock: B.idOf('bedrock'),
      deepslate: B.idOf('deepslate'), snow: B.idOf('snow_block'), ice: B.idOf('ice'),
      packed_ice: B.idOf('packed_ice'), clay: B.idOf('clay'), sandstone: B.idOf('sandstone'),
      terracotta: B.idOf('terracotta'), coarse: B.idOf('coarse_dirt'),
      andesite: B.idOf('andesite'), granite: B.idOf('granite'), diorite: B.idOf('diorite'),
      tuff: B.idOf('tuff'), calcite: B.idOf('calcite'), moss: B.idOf('moss_block'),
      mud: B.idOf('mud'), podzol: B.idOf('podzol'), mycelium: B.idOf('mycelium')
    };

    // badlands terracotta banding, precomputed per y
    this.bands = new Uint16Array(CY);
    const brng = new MC.RNG(s + 99);
    const palette = ['terracotta', 'orange_terracotta', 'yellow_terracotta', 'white_terracotta',
                     'brown_terracotta', 'red_terracotta', 'light_gray_terracotta'];
    for (let y = 0; y < CY; y++) this.bands[y] = B.idOf('terracotta');
    let y = 0;
    while (y < CY) {
      const h = 1 + brng.int(4);
      const col = B.idOf(brng.pick(palette));
      for (let k = 0; k < h && y + k < CY; k++) this.bands[y + k] = col;
      y += h + brng.int(3);
    }
  }

  /* ---------------- climate & height ---------------- */

  WorldGen.prototype.climate = function (x, z, out) {
    out = out || {};
    out.cont = this.nContinent.fbm2(x * 0.00135, z * 0.00135, 4);
    out.ero = this.nErosion.fbm2(x * 0.0009 + 41.3, z * 0.0009 - 17.7, 3);
    out.temp = this.nTemp.fbm2(x * 0.00095 - 88.1, z * 0.00095 + 12.9, 3);
    out.humid = this.nHumid.fbm2(x * 0.0011 + 210.5, z * 0.0011 + 77.2, 3);
    out.weird = this.nWeird.fbm2(x * 0.0042, z * 0.0042, 2);
    // rivers: thin valleys where a low-frequency field crosses zero
    const rv = this.nRiver.fbm2(x * 0.0016 + 500.0, z * 0.0016 - 500.0, 2);
    out.river = 1 - clamp(Math.abs(rv) / 0.055, 0, 1);
    return out;
  };

  WorldGen.prototype.heightAt = function (x, z, cl) {
    cl = cl || this.climate(x, z);
    const cont = cl.cont, ero = cl.ero;
    let h;
    if (cont < -0.42) h = 26 + (cont + 1) * 32;              // deep ocean
    else if (cont < -0.16) h = 44.5 + (cont + 0.42) * 48;    // ocean
    else if (cont < 0.02) h = 57 + (cont + 0.16) * 44;       // shelf / coast
    else h = 65 + (cont - 0.02) * 22;                        // inland

    // mountains grow where erosion is low and the land is well inland
    const inland = clamp((cont - 0.02) * 3.4, 0, 1);
    const mountain = Math.max(0, -ero - 0.05) * inland;
    const peak = this.nDetail.ridged2(x * 0.0034, z * 0.0034, 3);
    h += mountain * (60 + peak * 62) * (0.65 + cl.weird * 0.35);

    // local roughness, stronger on mountains
    const rough = 2.2 + mountain * 26 + inland * 2.5;
    h += this.nDetail.fbm2(x * 0.021, z * 0.021, 4) * rough;
    h += this.nDetail.noise2(x * 0.075, z * 0.075) * 1.1;

    // river carving (not in the deep ocean, and it fades out on peaks)
    if (cl.river > 0 && cont > -0.35) {
      const strength = cl.river * cl.river * clamp((h - SEA + 8) / 14, 0, 1);
      h = h - strength * (h - (SEA - 4.5)) * 0.92;
      cl.riverStrength = strength;
    } else cl.riverStrength = 0;

    return h;
  };

  /* ---------------- biome choice ---------------- */

  WorldGen.prototype.biomeAt = function (x, z, h, cl) {
    const bn = MC.biomes.byName;
    cl = cl || this.climate(x, z);
    const t = cl.temp, hu = cl.humid, w = cl.weird, cont = cl.cont;

    if (h < SEA - 1.5) {
      if (cl.riverStrength > 0.35 && cont > -0.16) return bn.river;
      if (cont < -0.42) return t < -0.45 ? bn.frozen_ocean : bn.deep_ocean;
      if (t < -0.45) return bn.frozen_ocean;
      if (t > 0.55) return bn.warm_ocean;
      return bn.ocean;
    }

    // shorelines
    if (h < SEA + 2.2) {
      if (cl.riverStrength > 0.3) return bn.river;
      if (t < -0.45) return bn.snowy_beach;
      const steep = Math.abs(this.nDetail.noise2(x * 0.02, z * 0.02));
      if (cl.ero < -0.35 && steep > 0.4) return bn.stony_shore;
      return bn.beach;
    }

    // high ground
    if (h > 132) return t < 0.1 ? bn.jagged_peaks : bn.stony_peaks;
    if (h > 116) return t < 0.25 ? bn.snowy_slopes : bn.stony_peaks;
    if (h > 100) {
      if (t < 0.15) return bn.grove;
      if (hu > 0.15) return bn.meadow;
      return bn.windswept_hills;
    }
    if (h > 88 && cl.ero < -0.2) return t < 0.05 ? bn.snowy_slopes : bn.windswept_hills;

    // rare mushroom islands, far out to sea
    if (cont < 0.06 && w > 0.72 && hu > 0.3) return bn.mushroom_fields;

    // frozen
    if (t < -0.45) {
      if (w > 0.6) return bn.ice_spikes;
      return hu > 0.05 ? bn.snowy_taiga : bn.snowy_plains;
    }
    // cold
    if (t < -0.12) {
      if (hu > 0.35) return bn.old_growth_taiga;
      return hu > -0.1 ? bn.taiga : bn.snowy_plains;
    }
    // temperate
    if (t < 0.28) {
      if (hu > 0.42 && h < SEA + 7) return bn.swamp;
      if (hu > 0.42) return bn.dark_forest;
      if (hu > 0.1) return w > 0.55 ? bn.flower_forest : bn.forest;
      if (hu > -0.15) return w > 0.4 ? bn.birch_forest : bn.plains;
      return w > 0.55 ? bn.sunflower_plains : bn.plains;
    }
    // warm
    if (t < 0.6) {
      if (hu > 0.4) return bn.jungle;
      if (hu > 0.05) return bn.forest;
      return bn.plains;
    }
    // hot
    if (hu > 0.42) return w > 0.5 ? bn.bamboo_jungle : bn.jungle;
    if (hu > 0.0) return bn.savanna;
    if (w > 0.45) return cl.ero < -0.25 ? bn.eroded_badlands : bn.badlands;
    return bn.desert;
  };

  /* ---------------- density / caves ---------------- */

  WorldGen.prototype.isCave = function (x, y, z, h) {
    if (y < 2 || y > h - 2) return false;
    // spaghetti tunnels: intersection of two near-zero ridged fields
    const a = Math.abs(this.nCave1.noise3(x * 0.0165, y * 0.026, z * 0.0165));
    if (a < 0.072) {
      const b = Math.abs(this.nCave2.noise3(x * 0.0165 + 91.7, y * 0.026 - 33.3, z * 0.0165 + 12.4));
      if (b < 0.072) return true;
    }
    // big cheese caverns, deeper down
    if (y < 62) {
      const c = this.nCheese.fbm3(x * 0.0092, y * 0.017, z * 0.0092, 3);
      const bias = 0.60 + Math.max(0, (y - 20) / 120) * 0.22;
      if (c > bias) return true;
    }
    return false;
  };

  /* ---------------- terrain fill ---------------- */

  WorldGen.prototype.generateChunk = function (chunk) {
    const blocks = chunk.blocks;
    const ID = this.ID;
    const baseX = chunk.cx * CX, baseZ = chunk.cz * CZ;
    const heights = chunk.heights || (chunk.heights = new Int16Array(CX * CZ));
    const biomeMap = chunk.biomeMap || (chunk.biomeMap = new Uint8Array(CX * CZ));
    const cl = {};
    const rng = new MC.RNG(MC.hashSeed(chunk.cx + ':' + chunk.cz + ':' + this.seed));

    for (let z = 0; z < CZ; z++) {
      for (let x = 0; x < CX; x++) {
        const wx = baseX + x, wz = baseZ + z;
        this.climate(wx, wz, cl);
        const hf = this.heightAt(wx, wz, cl);
        const h = clamp(Math.round(hf), 1, CY - 6);
        const biome = this.biomeAt(wx, wz, hf, cl);
        const ci = z * CX + x;
        heights[ci] = h;
        biomeMap[ci] = biome.id;

        const deepStart = 22 + this.nDeep.noise2(wx * 0.05, wz * 0.05) * 4;
        const surfaceId = B.idOf(biome.surface);
        const fillerId = B.idOf(biome.filler);
        const underwaterId = B.idOf(biome.underwater);
        const submerged = h < SEA;
        const topId = submerged ? underwaterId : surfaceId;
        const fillDepth = biome.fillerDepth;

        for (let y = 0; y <= h; y++) {
          let id;
          if (y === 0) id = ID.bedrock;
          else if (y < 4 && rng.next() < (4 - y) * 0.28) id = ID.bedrock;
          else if (y < deepStart) id = ID.deepslate;
          else id = ID.stone;

          // stone variety pockets
          if (id === ID.stone) {
            const v = this.nSurface.noise3(wx * 0.045, y * 0.045, wz * 0.045);
            if (v > 0.62) id = ID.granite;
            else if (v < -0.66) id = ID.diorite;
            else if (v > 0.44 && v < 0.5) id = ID.andesite;
          } else if (id === ID.deepslate) {
            const v = this.nSurface.noise3(wx * 0.05 + 9, y * 0.05, wz * 0.05 + 9);
            if (v > 0.68) id = ID.tuff;
            else if (v < -0.72) id = ID.calcite;
          }

          if (y > h - 1) id = topId;
          else if (y > h - 1 - fillDepth) {
            if (biome.terracottaBands && h > SEA + 3) id = this.bands[clamp(y, 0, CY - 1)];
            else id = fillerId;
          }

          if (this.isCave(wx, y, wz, h)) {
            id = y < 9 ? ID.lava : ID.air;
          }
          blocks[MC.idx(x, y, z)] = id;
        }

        // water / ice above the terrain, up to sea level
        if (h < SEA) {
          for (let y = h + 1; y <= SEA; y++) blocks[MC.idx(x, y, z)] = ID.water;
          if (biome.ice) blocks[MC.idx(x, SEA, z)] = ID.ice;
        } else if (biome.snow) {
          // a dusting of snow on exposed ground
          if (blocks[MC.idx(x, h, z)] !== ID.ice) blocks[MC.idx(x, h, z)] = ID.snow;
        }
      }
    }

    this.placeOres(chunk, rng);
    chunk.generated = true;
  };

  /* ---------------- ores ---------------- */

  const ORES = [
    { name: 'coal_ore', deep: null, tries: 20, size: 14, min: 5, max: 130 },
    { name: 'iron_ore', deep: 'deepslate_iron_ore', tries: 16, size: 9, min: 2, max: 110 },
    { name: 'copper_ore', deep: null, tries: 10, size: 10, min: 20, max: 96 },
    { name: 'gold_ore', deep: 'deepslate_gold_ore', tries: 5, size: 8, min: 2, max: 40 },
    { name: 'redstone_ore', deep: 'deepslate_redstone_ore', tries: 8, size: 8, min: 2, max: 26 },
    { name: 'lapis_ore', deep: 'deepslate_lapis_ore', tries: 3, size: 7, min: 2, max: 34 },
    { name: 'diamond_ore', deep: 'deepslate_diamond_ore', tries: 3, size: 7, min: 2, max: 20 },
    { name: 'emerald_ore', deep: 'deepslate_emerald_ore', tries: 2, size: 3, min: 40, max: 130 },
    { name: 'gravel', deep: null, tries: 6, size: 26, min: 10, max: 90 },
    { name: 'dirt', deep: null, tries: 8, size: 26, min: 10, max: 110 },
    { name: 'granite', deep: null, tries: 5, size: 30, min: 5, max: 80 },
    { name: 'andesite', deep: null, tries: 5, size: 30, min: 5, max: 80 },
    { name: 'diorite', deep: null, tries: 5, size: 30, min: 5, max: 80 }
  ];

  WorldGen.prototype.placeOres = function (chunk, rng) {
    const blocks = chunk.blocks, ID = this.ID;
    const heights = chunk.heights;
    for (let o = 0; o < ORES.length; o++) {
      const spec = ORES[o];
      const id = B.idOf(spec.name);
      const deepId = spec.deep ? B.idOf(spec.deep) : id;
      const isEmerald = spec.name === 'emerald_ore';
      for (let t = 0; t < spec.tries; t++) {
        if (isEmerald && rng.next() > 0.35) continue;
        const ox = rng.int(CX), oz = rng.int(CZ);
        const maxY = Math.min(spec.max, heights[oz * CX + ox] - 2);
        if (maxY <= spec.min) continue;
        const oy = spec.min + rng.int(maxY - spec.min);
        const n = 2 + rng.int(spec.size);
        let px = ox, py = oy, pz = oz;
        for (let k = 0; k < n; k++) {
          if (px >= 0 && px < CX && pz >= 0 && pz < CZ && py > 0 && py < CY) {
            const i = MC.idx(px, py, pz);
            const cur = blocks[i];
            if (cur === ID.stone || cur === ID.deepslate || cur === ID.granite ||
                cur === ID.andesite || cur === ID.diorite || cur === ID.tuff) {
              blocks[i] = (cur === ID.deepslate) ? deepId : id;
            }
          }
          px += rng.int(3) - 1; py += rng.int(3) - 1; pz += rng.int(3) - 1;
        }
      }
    }
  };

  /* ============================================================
   * decoration - runs after the terrain of a chunk exists.
   * Anything landing outside the chunk is deferred to the world.
   * ============================================================ */

  WorldGen.prototype.decorate = function (chunk, world) {
    const rng = new MC.RNG(MC.hashSeed('deco:' + chunk.cx + ':' + chunk.cz + ':' + this.seed));
    const baseX = chunk.cx * CX, baseZ = chunk.cz * CZ;
    const self = this;
    const set = function (wx, wy, wz, id, soft) {
      world.setGenBlock(wx, wy, wz, id, soft);
    };

    for (let z = 0; z < CZ; z++) {
      for (let x = 0; x < CX; x++) {
        const wx = baseX + x, wz = baseZ + z;
        const ci = z * CX + x;
        const h = chunk.heights[ci];
        const biome = MC.biomes.get(chunk.biomeMap[ci]);
        if (h >= CY - 8) continue;
        const groundId = chunk.blocks[MC.idx(x, h, z)];
        const above = chunk.blocks[MC.idx(x, h + 1, z)];
        const onLand = h >= SEA && above === 0;
        const grassy = groundId === self.ID.grass || groundId === self.ID.podzol ||
                       groundId === self.ID.mycelium || groundId === B.idOf('moss_block');

        /* --- trees --- */
        if (onLand && biome.treeChance > 0 && rng.next() < biome.treeChance && grassy) {
          const type = weighted(rng, biome.trees);
          self.tree(type, wx, h + 1, wz, rng, set);
          continue;
        }
        /* --- boulders --- */
        if (onLand && biome.boulderChance && rng.next() < biome.boulderChance) {
          const r = 1 + rng.int(2);
          const moss = B.idOf('mossy_cobblestone'), cob = B.idOf('cobblestone');
          for (let dy = -r; dy <= r; dy++) for (let dz = -r; dz <= r; dz++) for (let dx = -r; dx <= r; dx++) {
            if (dx * dx + dy * dy + dz * dz > r * r + 1) continue;
            set(wx + dx, h + dy + 1, wz + dz, rng.chance(0.4) ? moss : cob, true);
          }
          continue;
        }
        /* --- cactus --- */
        if (onLand && biome.cactusChance && rng.next() < biome.cactusChance && groundId === self.ID.sand) {
          const n = 1 + rng.int(3);
          const cact = B.idOf('cactus');
          for (let k = 0; k < n; k++) set(wx, h + 1 + k, wz, cact, true);
          continue;
        }
        /* --- sugar cane, beside water --- */
        if (onLand && (groundId === self.ID.sand || grassy) && rng.next() < 0.07) {
          if (world.nearWater(wx, h, wz)) {
            const n = 1 + rng.int(3);
            const cane = B.idOf('sugar_cane');
            for (let k = 0; k < n; k++) set(wx, h + 1 + k, wz, cane, true);
            continue;
          }
        }
        /* --- pumpkins / melons --- */
        if (onLand && grassy && biome.pumpkinChance && rng.next() < biome.pumpkinChance) {
          set(wx, h + 1, wz, B.idOf('pumpkin'), true); continue;
        }
        if (onLand && grassy && biome.melonChance && rng.next() < biome.melonChance) {
          set(wx, h + 1, wz, B.idOf('melon'), true); continue;
        }
        /* --- flowers --- */
        if (onLand && grassy && biome.flowerChance && rng.next() < biome.flowerChance) {
          set(wx, h + 1, wz, B.idOf(rng.pick(biome.flowers)), true); continue;
        }
        /* --- mushrooms --- */
        if (onLand && biome.mushroomChance && rng.next() < biome.mushroomChance) {
          set(wx, h + 1, wz, B.idOf(rng.chance(0.6) ? 'brown_mushroom' : 'red_mushroom'), true); continue;
        }
        /* --- dead bushes --- */
        if (onLand && biome.deadBushChance && rng.next() < biome.deadBushChance) {
          set(wx, h + 1, wz, B.idOf('dead_bush'), true); continue;
        }
        /* --- grass & ferns --- */
        if (onLand && grassy && biome.grassChance && rng.next() < biome.grassChance) {
          const tall = rng.chance(0.12);
          if (tall) {
            set(wx, h + 1, wz, B.idOf('tall_grass'), true);
            set(wx, h + 2, wz, B.idOf('tall_grass'), true);
          } else {
            set(wx, h + 1, wz, B.idOf(biome.temperature < 0.35 && rng.chance(0.3) ? 'fern' : 'short_grass'), true);
          }
          continue;
        }
        /* --- lily pads --- */
        if (biome.lilyChance && h < SEA && rng.next() < biome.lilyChance) {
          if (chunk.blocks[MC.idx(x, SEA, z)] === self.ID.water) {
            set(wx, SEA + 1, wz, B.idOf('lily_pad'), true);
          }
        }
      }
    }

    /* --- ice spikes --- */
    if (MC.biomes.get(chunk.biomeMap[8 * CX + 8]).name === 'ice_spikes' && rng.chance(0.35)) {
      const sx = baseX + rng.int(CX), sz = baseZ + rng.int(CZ);
      const sh = world.surfaceHeight(sx, sz);
      const hgt = 6 + rng.int(14);
      const pid = B.idOf('packed_ice');
      for (let k = 0; k < hgt; k++) {
        const r = Math.max(0, 2 - Math.floor(k / (hgt / 3)));
        for (let dz = -r; dz <= r; dz++) for (let dx = -r; dx <= r; dx++) {
          if (Math.abs(dx) + Math.abs(dz) > r) continue;
          set(sx + dx, sh + 1 + k, sz + dz, pid, true);
        }
      }
    }
    chunk.decorated = true;
  };

  function weighted(rng, pairs) {
    let total = 0;
    for (let i = 0; i < pairs.length; i++) total += pairs[i][1];
    let r = rng.next() * total;
    for (let i = 0; i < pairs.length; i++) {
      r -= pairs[i][1];
      if (r <= 0) return pairs[i][0];
    }
    return pairs[0][0];
  }

  /* ---------------- tree shapes ---------------- */

  WorldGen.prototype.tree = function (type, x, y, z, rng, set) {
    const wood = {
      oak: 'oak', big_oak: 'oak', swamp_oak: 'oak', birch: 'birch',
      spruce: 'spruce', mega_spruce: 'spruce', jungle: 'jungle',
      mega_jungle: 'jungle', acacia: 'acacia', dark_oak: 'dark_oak'
    }[type] || 'oak';
    const log = B.idOf(wood + '_log');
    const leaf = B.idOf(wood + '_leaves');

    function blob(cx, cy, cz, rx, ry, corners) {
      for (let dy = -ry; dy <= ry; dy++) {
        for (let dz = -rx; dz <= rx; dz++) {
          for (let dx = -rx; dx <= rx; dx++) {
            const d = (dx * dx + dz * dz) / (rx * rx + 0.1) + (dy * dy) / (ry * ry + 0.1);
            if (d > 1.05) continue;
            if (!corners && Math.abs(dx) === rx && Math.abs(dz) === rx && rng.chance(0.6)) continue;
            set(cx + dx, cy + dy, cz + dz, leaf, true);
          }
        }
      }
    }

    if (type === 'oak' || type === 'birch' || type === 'swamp_oak') {
      const h = (type === 'birch' ? 6 : 5) + rng.int(type === 'swamp_oak' ? 3 : 3);
      for (let k = 0; k < h; k++) set(x, y + k, z, log);
      blob(x, y + h - 1, z, 2, 2, false);
      set(x, y + h, z, leaf, true);
      if (type === 'swamp_oak') {
        // hanging vines
        const vine = B.idOf('vine');
        for (let i = 0; i < 6; i++) {
          const vx = x + rng.intRange(-2, 2), vz = z + rng.intRange(-2, 2);
          const len = 1 + rng.int(4);
          for (let k = 0; k < len; k++) set(vx, y + h - 2 - k, vz, vine, true);
        }
      }
      return;
    }

    if (type === 'big_oak') {
      const h = 8 + rng.int(5);
      for (let k = 0; k < h; k++) {
        set(x, y + k, z, log);
        if (k > 3 && rng.chance(0.35)) {
          const bx = x + rng.intRange(-1, 1), bz = z + rng.intRange(-1, 1);
          set(bx, y + k, bz, log, true);
          blob(bx, y + k + 1, bz, 2, 1, false);
        }
      }
      blob(x, y + h, z, 3, 2, false);
      blob(x, y + h + 2, z, 2, 1, false);
      return;
    }

    if (type === 'spruce' || type === 'mega_spruce') {
      const mega = type === 'mega_spruce';
      const h = mega ? 14 + rng.int(8) : 7 + rng.int(5);
      const w = mega ? 2 : 1;
      for (let k = 0; k < h; k++) {
        for (let dz = 0; dz < w; dz++) for (let dx = 0; dx < w; dx++) set(x + dx, y + k, z + dz, log);
      }
      let r = mega ? 4 : 3;
      const start = mega ? 6 : 2;
      for (let k = start; k < h + 2; k++) {
        const layer = (k - start) % 4;
        const rr = Math.max(0, r - Math.floor((k - start) / 3.5) + (layer === 0 ? 1 : 0));
        for (let dz = -rr; dz <= rr + w - 1; dz++) for (let dx = -rr; dx <= rr + w - 1; dx++) {
          if (Math.abs(dx) + Math.abs(dz) > rr + 1) continue;
          if (dx >= 0 && dx < w && dz >= 0 && dz < w && k < h) continue;
          set(x + dx, y + k, z + dz, leaf, true);
        }
      }
      set(x, y + h + 2, z, leaf, true);
      return;
    }

    if (type === 'jungle' || type === 'mega_jungle') {
      const mega = type === 'mega_jungle';
      const h = mega ? 16 + rng.int(10) : 8 + rng.int(6);
      const w = mega ? 2 : 1;
      for (let k = 0; k < h; k++)
        for (let dz = 0; dz < w; dz++) for (let dx = 0; dx < w; dx++) set(x + dx, y + k, z + dz, log);
      blob(x, y + h, z, mega ? 4 : 3, 2, false);
      if (mega) {
        blob(x + 1, y + h - 4, z + 1, 3, 1, false);
        const vine = B.idOf('vine');
        for (let i = 0; i < 14; i++) {
          const vx = x + rng.intRange(-4, 4), vz = z + rng.intRange(-4, 4);
          const len = 2 + rng.int(7);
          for (let k = 0; k < len; k++) set(vx, y + h - 2 - k, vz, vine, true);
        }
      }
      return;
    }

    if (type === 'acacia') {
      const h = 5 + rng.int(3);
      for (let k = 0; k < h; k++) set(x, y + k, z, log);
      const dx = rng.chance(0.5) ? 1 : -1, dz = rng.chance(0.5) ? 1 : -1;
      let bx = x, bz = z;

  function desStack(d) { return d ? MC.stack(d[0], d[1], d[2]) : null; }

  World.serializeTile = function (t) {
    if (t.kind === 'chest') return { k: 'c', i: t.items.map(serStack) };
    return {
      k: 'f', in: serStack(t.input), fu: serStack(t.fuel), ou: serStack(t.output),
      b: t.burn, bm: t.burnMax, ck: t.cook
    };
  };

  World.deserializeTile = function (d, cx, cz, idx) {
    if (!d) return null;
    const x = cx * CX + (idx & 15);
    const z = cz * CZ + ((idx >> 4) & 15);
    const y = idx >> 8;
    if (d.k === 'c') {
      const items = new Array(27).fill(null);
      const src = d.i || [];
      for (let i = 0; i < 27; i++) items[i] = desStack(src[i]);
      return { kind: 'chest', x: x, y: y, z: z, items: items };
    }
    return {
      kind: 'furnace', x: x, y: y, z: z,
      input: desStack(d.in), fuel: desStack(d.fu), output: desStack(d.ou),
      burn: d.b || 0, burnMax: d.bm || 0, cook: d.ck || 0
    };
  };

  // Called when a chunk is about to unload, so its containers survive.
  World.prototype.stashChunk = function (c) {
    if (c.edits && c.edits.size) {
      if (!this.savedEdits) this.savedEdits = {};
      const o = {};
      c.edits.forEach(function (v, k) { o[k] = v; });
      this.savedEdits[c.key] = o;
    }
    if (c.tiles && c.tiles.size) {
      if (!this.savedTiles) this.savedTiles = {};
      const o = {};
      c.tiles.forEach(function (t, k) { o[k] = World.serializeTile(t); });
      this.savedTiles[c.key] = o;
    } else if (this.savedTiles) {
      delete this.savedTiles[c.key];
    }
  };

  World.prototype.exportTiles = function () {
    const out = {};
    this.chunks.forEach(function (c, key) {
      if (!c.tiles || c.tiles.size === 0) return;
      const o = {};
      c.tiles.forEach(function (t, k) { o[k] = World.serializeTile(t); });
      out[key] = o;
    });
    if (this.savedTiles) {
      for (const k in this.savedTiles) if (!out[k]) out[k] = this.savedTiles[k];
    }
    return out;
  };

  World.prototype.exportEdits = function () {
    const out = {};
    this.chunks.forEach(function (c, key) {
      if (!c.edits || c.edits.size === 0) return;
      const o = {};
      c.edits.forEach(function (v, k) { o[k] = v; });
      out[key] = o;
    });
    if (this.savedEdits) {
      // keep edits for chunks that have since been unloaded
      for (const k in this.savedEdits) if (!out[k]) out[k] = this.savedEdits[k];
    }
    return out;
  };

  MC.World = World;
})();

<script>
/* ---- js/world/mesher.js ---- */
/* ============================================================
 * mesher.js - turns a chunk of voxels into GPU-ready geometry.
 * Face culling + per-vertex ambient occlusion + smooth lighting.
 *
 * Vertex layout (stride 20 bytes):
 *   0  : 3 x uint16   position, 1/16 block units, chunk-local
 *   6  : 2 x uint16   texture coords, normalised
 *   10 : 4 x uint8    skyLight, blockLight, ao, wave
 *   14 : 4 x uint8    tint rgb + pad
 * ============================================================ */
(function () {
  'use strict';
  const MC = window.MC || (window.MC = {});
  const B = MC.blocks;
  const CX = MC.CHUNK.X, CZ = MC.CHUNK.Z, CY = MC.CHUNK.Y;
  const idx = MC.idx;

  const STRIDE = 20;
  const MAX_QUADS_PER_SEG = 16384;   // keeps us inside 16-bit index range
  MC.MESH = { STRIDE: STRIDE, MAX_QUADS_PER_SEG: MAX_QUADS_PER_SEG };

  /* face basis: normal, tangent, bitangent, and the corner the quad starts at */
  const FACES = [
    { n: [1, 0, 0], t: [0, 0, -1], b: [0, 1, 0], o: [1, 0, 1], shade: 0.80 },  // +X
    { n: [-1, 0, 0], t: [0, 0, 1], b: [0, 1, 0], o: [0, 0, 0], shade: 0.80 },  // -X
    { n: [0, 1, 0], t: [1, 0, 0], b: [0, 0, -1], o: [0, 1, 1], shade: 1.00 },  // +Y
    { n: [0, -1, 0], t: [1, 0, 0], b: [0, 0, 1], o: [0, 0, 0], shade: 0.55 },  // -Y
    { n: [0, 0, 1], t: [1, 0, 0], b: [0, 1, 0], o: [0, 0, 1], shade: 0.66 },  // +Z
    { n: [0, 0, -1], t: [-1, 0, 0], b: [0, 1, 0], o: [1, 0, 0], shade: 0.66 }   // -Z
  ];
  const FACE_NAME = ['side', 'side', 'top', 'bottom', 'side', 'side'];

  /* ---- per-block face texture indices, resolved once ---- */
  let FACE_UV = null;      // [blockId*6 + face] -> Float32Array uv
  let OVERLAY_UV = null;   // grass fringe
  let CULL_SAME = null;    // hide the seam between two identical blocks
  let WAVE = null;         // how much this block sways

  function initTables() {
    const n = B.list.length;
    FACE_UV = new Array(n * 6);
    OVERLAY_UV = new Array(n);
    CULL_SAME = new Uint8Array(n);
    WAVE = new Uint8Array(n);
    for (let i = 0; i < n; i++) {
      const blk = B.list[i];
      for (let f = 0; f < 6; f++) {
        let name;
        const t = blk.tex;
        if (typeof t === 'string') name = t;
        else {
          const fn = FACE_NAME[f];
          if (fn === 'top') name = t.top || t.side || t.all;
          else if (fn === 'bottom') name = t.bottom || t.side || t.all;
          else name = t.side || t.all;
          // "front" faces point south (-Z) by default
          if (f === 5 && t.front) name = t.front;
        }
        FACE_UV[i * 6 + f] = MC.atlas.uv[name] || MC.atlas.uv.white;
      }
      OVERLAY_UV[i] = blk.overlay ? MC.atlas.uv[blk.overlay] : null;
      CULL_SAME[i] = (blk.render === 'liquid' || /glass|_ice$|^ice$/.test(blk.name)) ? 1 : 0;
      if (blk.render === 'cross' && blk.name !== 'torch' && blk.name !== 'ladder') WAVE[i] = 26;
      if (blk.name === 'water') WAVE[i] = 18;
      if (/leaves/.test(blk.name)) WAVE[i] = 10;
    }
  }
  MC.initMeshTables = initTables;

  /* ---- growable scratch buffers, reused across every chunk ---- */
  function Scratch(quads) {
    this.cap = quads;
    this.buf = new ArrayBuffer(quads * 4 * STRIDE);
    this.u8 = new Uint8Array(this.buf);
    this.u16 = new Uint16Array(this.buf);
    this.quads = 0;
  }
  Scratch.prototype.reset = function () { this.quads = 0; };
  Scratch.prototype.ensure = function (extra) {
    if (this.quads + extra <= this.cap) return;
    let cap = this.cap;
    while (cap < this.quads + extra) cap *= 2;
    const nb = new ArrayBuffer(cap * 4 * STRIDE);
    new Uint8Array(nb).set(this.u8.subarray(0, this.quads * 4 * STRIDE));
    this.buf = nb; this.u8 = new Uint8Array(nb); this.u16 = new Uint16Array(nb);
    this.cap = cap;
  };
  Scratch.prototype.data = function () {
    return new Uint8Array(this.buf, 0, this.quads * 4 * STRIDE);
  };

  const solidScratch = new Scratch(4096);
  const waterScratch = new Scratch(1024);

  /* light curve: matches Minecraft's falloff closely enough */
  const LIGHT_CURVE = new Uint8Array(16);
  for (let i = 0; i < 16; i++) LIGHT_CURVE[i] = Math.round(255 * Math.pow(0.8, 15 - i));

  const AO_LEVELS = [Math.round(255 * 0.46), Math.round(255 * 0.68), Math.round(255 * 0.85), 255];

  /* ============================================================
   * Mesher
   * ============================================================ */
  function Mesher(world) {
    this.world = world;
    if (!FACE_UV) initTables();
    this.grassCol = new Int32Array(CX * CZ);
    this.foliageCol = new Int32Array(CX * CZ);
    this.waterCol = new Int32Array(CX * CZ);
  }

  // blend biome colours over a 3x3 area so borders don't hard-cut
  Mesher.prototype.prepColours = function (chunk) {
    const world = this.world;
    const bx = chunk.cx * CX, bz = chunk.cz * CZ;
    for (let z = 0; z < CZ; z++) {
      for (let x = 0; x < CX; x++) {
        let gr = 0, gg = 0, gb = 0, fr = 0, fg = 0, fb = 0, wr = 0, wg = 0, wb = 0, n = 0;
        for (let dz = -1; dz <= 1; dz++) {
          for (let dx = -1; dx <= 1; dx++) {
            const bio = world.biomeAt(bx + x + dx * 3, bz + z + dz * 3);
            gr += (bio.grass >> 16) & 255; gg += (bio.grass >> 8) & 255; gb += bio.grass & 255;
            fr += (bio.foliage >> 16) & 255; fg += (bio.foliage >> 8) & 255; fb += bio.foliage & 255;
            wr += (bio.water >> 16) & 255; wg += (bio.water >> 8) & 255; wb += bio.water & 255;
            n++;
          }
        }
        const i = z * CX + x;
        this.grassCol[i] = (((gr / n) | 0) << 16) | (((gg / n) | 0) << 8) | ((gb / n) | 0);
        this.foliageCol[i] = (((fr / n) | 0) << 16) | (((fg / n) | 0) << 8) | ((fb / n) | 0);
        this.waterCol[i] = (((wr / n) | 0) << 16) | (((wg / n) | 0) << 8) | ((wb / n) | 0);
      }
    }
  };

  Mesher.prototype.build = function (chunk) {
    const world = this.world, T = B.T;
    const blocks = chunk.blocks, light = chunk.light;
    const bx = chunk.cx * CX, bz = chunk.cz * CZ;
    solidScratch.reset();
    waterScratch.reset();
    this.prepColours(chunk);

    // neighbour chunks, fetched once
    const nc = [
      world.getChunk(chunk.cx + 1, chunk.cz), world.getChunk(chunk.cx - 1, chunk.cz),
      null, null,
      world.getChunk(chunk.cx, chunk.cz + 1), world.getChunk(chunk.cx, chunk.cz - 1)
    ];

    const self = this;
    // block id at chunk-local coords, crossing into neighbours when needed
    function at(x, y, z) {
      if (y < 0) return 1;
      if (y >= CY) return 0;
      if (x >= 0 && x < CX && z >= 0 && z < CZ) return blocks[idx(x, y, z)];
      const c = world.chunks.get(((bx + x) >> 4) + ',' + ((bz + z) >> 4));
      if (!c) return 0;
      return c.blocks[idx((bx + x) & 15, y, (bz + z) & 15)];
    }
    function lightAt(x, y, z) {
      if (y < 0 || y >= CY) return y >= CY ? 0xf0 : 0;
      if (x >= 0 && x < CX && z >= 0 && z < CZ) return light[idx(x, y, z)];
      const c = world.chunks.get(((bx + x) >> 4) + ',' + ((bz + z) >> 4));
      if (!c) return 0xf0;
      return c.light[idx((bx + x) & 15, y, (bz + z) & 15)];
    }

    const maxY = Math.min(CY - 1, chunk.maxY + 1);
    for (let y = 0; y <= maxY; y++) {
      for (let z = 0; z < CZ; z++) {
        for (let x = 0; x < CX; x++) {
          const id = blocks[idx(x, y, z)];
          if (id === 0) continue;
          const rt = T.render[id];
          if (rt === 0) continue;
          if (rt === 2) { this.emitCross(chunk, x, y, z, id, at, lightAt); continue; }
          if (rt === 3) { this.emitLiquid(chunk, x, y, z, id, at, lightAt); continue; }
          this.emitCube(chunk, x, y, z, id, at, lightAt);
        }
      }
    }

    return {
      solid: solidScratch.data(),
      solidQuads: solidScratch.quads,
      water: waterScratch.data(),
      waterQuads: waterScratch.quads
    };
  };

  /* ---- writes one quad; corners are given in the face's (t,b) basis ---- */
  function writeQuad(s, px, py, pz, face, uv, lights, aos, tint, wave, flip) {
    s.ensure(1);
    const base = s.quads * 4 * STRIDE;
    const u16 = s.u16, u8 = s.u8;
    const f = FACES[face];
    const o = f.o, t = f.t, b = f.b;
    const u0 = uv[0] * 65535, v0 = uv[1] * 65535, u1 = uv[2] * 65535, v1 = uv[3] * 65535;
    // corner order: (0,0) (1,0) (1,1) (0,1)
    const CA = [0, 1, 1, 0], CB = [0, 0, 1, 1];
    // flipping the diagonal when AO is uneven avoids the classic seam artefact
    const order = flip ? [1, 2, 3, 0] : [0, 1, 2, 3];
    for (let k = 0; k < 4; k++) {
      const i = order[k];
      const a = CA[i], c = CB[i];
      const vx = px + o[0] + t[0] * a + b[0] * c;
      const vy = py + o[1] + t[1] * a + b[1] * c;
      const vz = pz + o[2] + t[2] * a + b[2] * c;
      const off = base + k * STRIDE;
      const h = off >> 1;
      u16[h] = (vx * 16) | 0;
      u16[h + 1] = (vy * 16) | 0;
      u16[h + 2] = (vz * 16) | 0;
      u16[h + 3] = (u0 + (u1 - u0) * a) | 0;
      u16[h + 4] = (v0 + (v1 - v0) * (1 - c)) | 0;
      u8[off + 10] = lights[i] >> 8;          // sky
      u8[off + 11] = lights[i] & 255;         // block
      u8[off + 12] = aos[i];
      u8[off + 13] = wave;
      u8[off + 14] = tint[0];
      u8[off + 15] = tint[1];
      u8[off + 16] = tint[2];
      u8[off + 17] = 255;
    }
    s.quads++;
  }

  // fractional-height quad (water surface, plant crosses) needs raw corners
  function writeFreeQuad(s, verts, uv, lights, aos, tint, wave) {
    s.ensure(1);
    const base = s.quads * 4 * STRIDE;
    const u16 = s.u16, u8 = s.u8;
    const u0 = uv[0] * 65535, v0 = uv[1] * 65535, u1 = uv[2] * 65535, v1 = uv[3] * 65535;
    const CA = [0, 1, 1, 0], CB = [0, 0, 1, 1];
    for (let k = 0; k < 4; k++) {
      const off = base + k * STRIDE, h = off >> 1;
      u16[h] = (verts[k * 3] * 16) | 0;
      u16[h + 1] = (verts[k * 3 + 1] * 16) | 0;
      u16[h + 2] = (verts[k * 3 + 2] * 16) | 0;
      u16[h + 3] = (u0 + (u1 - u0) * CA[k]) | 0;
      u16[h + 4] = (v0 + (v1 - v0) * (1 - CB[k])) | 0;
      u8[off + 10] = lights[k] >> 8;
      u8[off + 11] = lights[k] & 255;
      u8[off + 12] = aos[k];
      u8[off + 13] = wave;
      u8[off + 14] = tint[0]; u8[off + 15] = tint[1]; u8[off + 16] = tint[2];
      u8[off + 17] = 255;
    }
    s.quads++;
  }

  const tmpLights = new Uint32Array(4);
  const tmpAO = new Uint8Array(4);
  const tmpTint = new Uint8Array(3);
  const overlayTint = new Uint8Array(3);

  Mesher.prototype.tintFor = function (id, x, z, face) {
    const blk = B.list[id];
    const ci = z * CX + x;
    let col = 0xffffff;
    if (blk.tint === MC.TINT.GRASS) col = this.grassCol[ci];
    else if (blk.tint === MC.TINT.FOLIAGE) col = this.foliageCol[ci];
    else if (blk.tint === MC.TINT.WATER) col = this.waterCol[ci];
    if (blk.tint !== 0 && blk.tintFaces === 'top' && face !== 2) col = 0xffffff;
    tmpTint[0] = (col >> 16) & 255; tmpTint[1] = (col >> 8) & 255; tmpTint[2] = col & 255;
    return tmpTint;
  };

  /* ---------------- solid cube ---------------- */
  Mesher.prototype.emitCube = function (chunk, x, y, z, id, at, lightAt) {
    const T = B.T;
    const blk = B.list[id];
    const overlayUV = OVERLAY_UV[id];
    for (let f = 0; f < 6; f++) {
      const fc = FACES[f];
      const nx = x + fc.n[0], ny = y + fc.n[1], nz = z + fc.n[2];
      const nid = at(nx, ny, nz);
      if (T.opaque[nid]) continue;
      if (nid === id && CULL_SAME[id]) continue;
      // don't draw the underside of a block resting on the world floor
      if (ny < 0) continue;

      this.faceLightAO(x, y, z, f, at, lightAt, fc.shade);
      const tint = this.tintFor(id, x, z, f);
      const flip = (tmpAO[0] + tmpAO[2]) < (tmpAO[1] + tmpAO[3]);
      writeQuad(solidScratch, x, y, z, f, FACE_UV[id * 6 + f], tmpLights, tmpAO, tint, 0, flip);

      // grass fringe on the four sides, always tinted like the top face
      if (overlayUV && f !== 2 && f !== 3) {
        const col = this.grassCol[z * CX + x];
        overlayTint[0] = (col >> 16) & 255;
        overlayTint[1] = (col >> 8) & 255;
        overlayTint[2] = col & 255;
        writeOverlay(x, y, z, f, overlayUV, tmpLights, tmpAO, overlayTint);
      }
    }
  };

  function writeOverlay(x, y, z, f, uv, lights, aos, tint) {
    const fc = FACES[f];
    // nudge the fringe out of the face to avoid z-fighting
    const e = 0.002;
    const verts = [];
    const CA = [0, 1, 1, 0], CB = [0, 0, 1, 1];
    for (let k = 0; k < 4; k++) {
      verts.push(
        x + fc.o[0] + fc.t[0] * CA[k] + fc.b[0] * CB[k] + fc.n[0] * e,
        y + fc.o[1] + fc.t[1] * CA[k] + fc.b[1] * CB[k] + fc.n[1] * e,
        z + fc.o[2] + fc.t[2] * CA[k] + fc.b[2] * CB[k] + fc.n[2] * e
      );
    }
    writeFreeQuad(solidScratch, verts, uv, lights, aos, tint, 0);
  }

  /* ---------------- smooth light + AO for one face ---------------- */
  Mesher.prototype.faceLightAO = function (x, y, z, f, at, lightAt, shade) {
    const T = B.T;
    const fc = FACES[f];
    const nx = x + fc.n[0], ny = y + fc.n[1], nz = z + fc.n[2];
    const t = fc.t, b = fc.b;
    const CA = [0, 1, 1, 0], CB = [0, 0, 1, 1];
    for (let k = 0; k < 4; k++) {
      const du = CA[k] * 2 - 1, dv = CB[k] * 2 - 1;
      const s1x = nx + t[0] * du, s1y = ny + t[1] * du, s1z = nz + t[2] * du;
      const s2x = nx + b[0] * dv, s2y = ny + b[1] * dv, s2z = nz + b[2] * dv;
      const cx = s1x + b[0] * dv, cy = s1y + b[1] * dv, cz = s1z + b[2] * dv;
      const o1 = T.opaque[at(s1x, s1y, s1z)] ? 1 : 0;
      const o2 = T.opaque[at(s2x, s2y, s2z)] ? 1 : 0;
      const oc = T.opaque[at(cx, cy, cz)] ? 1 : 0;
      const level = (o1 && o2) ? 0 : (3 - (o1 + o2 + oc));
      tmpAO[k] = (AO_LEVELS[level] * shade) | 0;

      // smooth lighting: average the open cells around this vertex
      let sky = 0, blk = 0, n = 0;
      const cells = [[nx, ny, nz], [s1x, s1y, s1z], [s2x, s2y, s2z], [cx, cy, cz]];
      for (let c = 0; c < 4; c++) {
        const p = cells[c];
        if (T.opaque[at(p[0], p[1], p[2])]) continue;
        const L = lightAt(p[0], p[1], p[2]);
        sky += L >> 4; blk += L & 15; n++;
      }
      if (n === 0) { const L = lightAt(nx, ny, nz); sky = L >> 4; blk = L & 15; n = 1; }
      tmpLights[k] = (LIGHT_CURVE[Math.round(sky / n)] << 8) | LIGHT_CURVE[Math.round(blk / n)];
    }
  };

  /* ---------------- cross-shaped plants ---------------- */
  Mesher.prototype.emitCross = function (chunk, x, y, z, id, at, lightAt) {
    const L = lightAt(x, y, z);
    const lv = (LIGHT_CURVE[L >> 4] << 8) | LIGHT_CURVE[L & 15];
    for (let k = 0; k < 4; k++) { tmpLights[k] = lv; tmpAO[k] = 255; }
    const tint = this.tintFor(id, x, z, 2);
    const uv = FACE_UV[id * 6];
    const wave = WAVE[id];
    const m = 0.1464;   // inset so the diagonals fit inside the block
    const planes = [
      [x + m, y, z + m, x + 1 - m, y, z + 1 - m],
      [x + 1 - m, y, z + m, x + m, y, z + 1 - m]
    ];
    for (let p = 0; p < 2; p++) {
      const q = planes[p];
      const front = [q[0], y, q[2], q[3], y, q[5], q[3], y + 1, q[5], q[0], y + 1, q[2]];
      const back = [q[3], y, q[5], q[0], y, q[2], q[0], y + 1, q[2], q[3], y + 1, q[5]];
      writeFreeQuad(solidScratch, front, uv, tmpLights, tmpAO, tint, wave);
      writeFreeQuad(solidScratch, back, uv, tmpLights, tmpAO, tint, wave);
    }
  };

  /* ---------------- liquids ---------------- */
  Mesher.prototype.emitLiquid = function (chunk, x, y, z, id, at, lightAt) {
    const T = B.T;
    const above = at(x, y + 1, z);
    const surface = (above !== id);
    const top = surface ? 0.885 : 1.0;
    const uv = FACE_UV[id * 6];
    const isWater = B.list[id].name === 'water';
    const scratch = isWater ? waterScratch : solidScratch;
    const wave = isWater ? WAVE[id] : 0;

    for (let f = 0; f < 6; f++) {
      const fc = FACES[f];
      const nx = x + fc.n[0], ny = y + fc.n[1], nz = z + fc.n[2];
      const nid = at(nx, ny, nz);
      if (T.opaque[nid]) continue;
      if (nid === id) continue;
      if (ny < 0) continue;
      if (f === 3 && T.render[nid] === 3) continue;

      const L = lightAt(nx, ny, nz);
      const lv = (LIGHT_CURVE[L >> 4] << 8) | LIGHT_CURVE[L & 15];
      const sh = (fc.shade * 255) | 0;
      for (let k = 0; k < 4; k++) { tmpLights[k] = lv; tmpAO[k] = sh; }
      const tint = this.tintFor(id, x, z, f);

      if (top === 1.0) {
        writeQuad(scratch, x, y, z, f, uv, tmpLights, tmpAO, tint, wave, false);
      } else {
        // build the quad by hand so the surface can sit below the block top
        const o = fc.o, t = fc.t, b = fc.b;
        const verts = [];
        const CA = [0, 1, 1, 0], CB = [0, 0, 1, 1];
        for (let k = 0; k < 4; k++) {
          let vy = y + o[1] + t[1] * CA[k] + b[1] * CB[k];
          if (vy > y + top) vy = y + top;
          verts.push(
            x + o[0] + t[0] * CA[k] + b[0] * CB[k],
            vy,
            z + o[2] + t[2] * CA[k] + b[2] * CB[k]
          );
        }
        writeFreeQuad(scratch, verts, uv, tmpLights, tmpAO, tint, f === 2 ? wave : 0);
      }
    }
  };

  MC.Mesher = Mesher;
})();
